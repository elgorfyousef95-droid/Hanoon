
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b19">
  <title>عضو في هنون | HANOON</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #e6c77d;
      --purple: #a18aff;
      --purple-light: #c5b6ff;
      --teal: #58d9cf;
      --text: #f8f5ff;
      --muted: #c0bad1;
      --glass: rgba(24, 20, 43, .55);
      --glass-border: rgba(255,255,255,.13);
      --shadow: 0 20px 65px rgba(0,0,0,.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: #0d0b19;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Cairo", sans-serif;
      background:
        linear-gradient(135deg, rgba(9,7,23,.78), rgba(17,10,38,.58)),
        url("https://images.unsplash.com/photo-1754851539824-5a87c5c7cb86?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=85&w=2400")
        center center / cover fixed no-repeat;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 15%, rgba(153,111,255,.19), transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(99,65,190,.15), transparent 38%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .topbar {
      position: relative;
      z-index: 2;
      min-height: 76px;
      padding: 12px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(13,10,29,.52);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 8px 35px rgba(0,0,0,.13);
    }

    .brand {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 25px rgba(186,148,255,.35);
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 17px;
      border: 1px solid rgba(211,190,255,.23);
      border-radius: 13px;
      background: rgba(255,255,255,.07);
      color: #f5efff;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(12px);
      transition: .25s ease;
    }

    .home-link:hover {
      background: rgba(161,138,255,.19);
      border-color: rgba(193,174,255,.55);
      transform: translateY(-2px);
    }

    .home-link svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(760px, 92%);
      margin: 42px auto 55px;
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro small {
      display: inline-block;
      padding: 6px 15px;
      border: 1px solid rgba(193,171,255,.25);
      border-radius: 30px;
      background: rgba(151,119,255,.12);
      color: var(--purple-light);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: .5px;
      backdrop-filter: blur(12px);
    }

    .intro h1 {
      margin-top: 13px;
      font-size: clamp(25px, 5vw, 34px);
      font-weight: 900;
      text-shadow: 0 5px 25px rgba(0,0,0,.3);
    }

    .intro p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .loading {
      padding: 45px 15px;
      color: #e0d8f5;
      text-align: center;
      font-size: 13px;
    }

    .loading::after {
      content: "";
      display: block;
      width: 27px;
      height: 27px;
      margin: 15px auto 0;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: var(--purple-light);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      display: none;
      padding: 22px;
      border: 1px solid rgba(255,125,151,.25);
      border-radius: 18px;
      background: rgba(105,28,57,.30);
      color: #ffc1ce;
      text-align: center;
      font-size: 13px;
      line-height: 2;
      backdrop-filter: blur(18px);
    }

    .error.show {
      display: block;
    }

    #memberContent {
      animation: appear .55s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 38px 25px 31px;
      border: 1px solid rgba(220,204,255,.22);
      border-radius: 30px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.13),
        rgba(35,25,65,.40) 48%,
        rgba(18,15,37,.58)
      );
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 300px;
      height: 300px;
      top: -180px;
      right: calc(50% - 150px);
      border-radius: 50%;
      background: rgba(164,126,255,.25);
      filter: blur(55px);
    }

    .card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        120deg,
        rgba(255,255,255,.06),
        transparent 35%,
        transparent 70%,
        rgba(172,142,255,.06)
      );
      pointer-events: none;
    }

    .avatar {
      position: relative;
      width: 145px;
      height: 145px;
      margin: 0 auto 19px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 3px solid rgba(231,207,255,.88);
      border-radius: 50%;
      background: linear-gradient(135deg,#9275ed,#44336e);
      color: white;
      font-size: 46px;
      font-weight: 900;
      box-shadow:
        0 0 0 8px rgba(166,130,255,.10),
        0 0 45px rgba(153,112,255,.36);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      position: relative;
      font-size: clamp(23px, 5vw, 29px);
      font-weight: 900;
      overflow-wrap: anywhere;
      text-shadow: 0 3px 20px rgba(0,0,0,.25);
    }

    .username {
      position: relative;
      margin-top: 5px;
      color: var(--purple-light);
      font-size: 13px;
      direction: ltr;
    }

    .bio {
      position: relative;
      max-width: 540px;
      margin: 18px auto;
      color: #d4cde6;
      font-size: 13px;
      line-height: 2.2;
      overflow-wrap: anywhere;
    }

    .code {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 5px;
      padding: 9px 19px;
      border: 1px solid rgba(224,199,255,.27);
      border-radius: 30px;
      background: rgba(255,255,255,.075);
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      direction: ltr;
      backdrop-filter: blur(12px);
    }

    .section {
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      padding: 23px;
      border: 1px solid var(--glass-border);
      border-radius: 23px;
      background: rgba(24,20,44,.53);
      box-shadow: 0 14px 40px rgba(0,0,0,.17);
      text-align: right;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .section h3 {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 17px;
      font-size: 16px;
      font-weight: 800;
    }

    .section h3::before {
      content: "";
      width: 4px;
      height: 22px;
      border-radius: 5px;
      background: linear-gradient(var(--purple-light),var(--teal));
      box-shadow: 0 0 15px rgba(161,138,255,.5);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 15px;
      border: 1px solid rgba(179,155,255,.23);
      border-radius: 30px;
      background: linear-gradient(
        135deg,
        rgba(157,126,255,.15),
        rgba(255,255,255,.045)
      );
      color: #e0d5ff;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: .2s ease;
    }

    .tag:hover {
      border-color: rgba(191,172,255,.5);
      background: rgba(157,126,255,.22);
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 25px 10px 30px;
      color: rgba(224,215,245,.68);
      text-align: center;
      font-size: 11px;
      line-height: 2;
    }

    [hidden] {
      display: none !important;
    }

    @media(max-width:550px) {
      .topbar {
        min-height: 66px;
        padding: 10px 4%;
      }

      .brand {
        font-size: 23px;
      }

      .container {
        width: 92%;
        margin-top: 25px;
      }

      .card {
        padding: 31px 17px 26px;
        border-radius: 25px;
      }

      .avatar {
        width: 125px;
        height: 125px;
      }

      .section {
        padding: 19px 16px;
        border-radius: 20px;
      }
    }

    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="../index.html" class="brand">HANOON</a>

    <a href="../index.html" class="home-link">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>
      </svg>
      الرئيسية
    </a>
  </header>

  <main class="container">

    <div class="intro">
      <small>مجتمع المعرفة</small>
      <h1>هوية عضو هنون</h1>
      <p>تعرّف على أحد أعضاء مجتمع هنون.</p>
    </div>

    <div class="loading" id="loading">
      جارٍ البحث عن العضو...
    </div>

    <div class="error" id="error" role="alert"></div>

    <div id="memberContent" hidden>

      <section class="card">

        <div class="avatar" id="avatar">H</div>

        <h2 class="name" id="name"></h2>

        <div class="username" id="username"></div>

        <p class="bio" id="bio"></p>

        <div class="code" id="memberCode"></div>

      </section>

      <section class="section">
        <h3>الهوايات</h3>
        <div class="tags" id="hobbies"></div>
      </section>

      <section class="section">
        <h3>الاهتمامات القرائية</h3>
        <div class="tags" id="reading"></div>
      </section>

    </div>

  </main>

  <footer>
    HANOON — المعرفة تصنع الفرق
    <br>
    جميع الحقوق محفوظة © HANOON
  </footer>

  <script type="module" src="../js/supabase-client.js"></script>
  <script src="../js/member.js" defer></script>

</body>
</html>
