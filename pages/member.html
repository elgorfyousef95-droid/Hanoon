
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#080808">
<title>الملف الشخصي | HANOON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#080808;
  --panel:#121212;
  --text:#f7f7f7;
  --muted:#929292;
  --pink:#fe2c55;
  --line:#292929;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Cairo,sans-serif;
  overflow-x:hidden;
}
button,a{font:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* رأس الصفحة */
.topbar{
  height:58px;
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  background:#080808f5;
  border-bottom:1px solid #202020;
}
.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}
.brand span{color:var(--pink)}
.top-actions{display:flex;align-items:center;gap:18px}
.top-actions a,.top-actions button{
  border:0;
  background:none;
  color:white;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.top-actions svg{
  width:23px;height:23px;
  fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

/* محتوى الملف */
.container{
  width:min(680px,100%);
  margin:auto;
  padding-bottom:45px;
}
.intro{display:none}
#memberContent{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.loading{
  padding:65px 15px;
  text-align:center;
  color:#bbb;
  font-size:13px;
}
.loading:after{
  content:"";
  display:block;
  width:25px;height:25px;
  margin:15px auto;
  border:2px solid #333;
  border-top-color:var(--pink);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error{
  display:none;
  margin:25px 15px;
  padding:20px;
  border-radius:12px;
  background:#28151b;
  color:#ff9aad;
  text-align:center;
  font-size:13px;
}
.error.show{display:block}

/* بطاقة الهوية */
.card{
  position:relative;
  padding:28px 18px 20px;
  background:var(--bg);
  border:0;
  border-radius:0;
  box-shadow:none;
  text-align:center;
  overflow:visible;
}
.card:before,.card:after{display:none}
.avatar{
  width:104px;height:104px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:2px solid #333;
  border-radius:50%;
  background:#292929;
  color:white;
  font-size:35px;
  font-weight:900;
  box-shadow:0 0 0 3px #171717;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{
  font-size:20px;
  font-weight:900;
  line-height:1.5;
}
.username{
  margin-top:2px;
  color:#ddd;
  font-size:13px;
  direction:ltr;
}
.bio{
  max-width:440px;
  margin:12px auto 8px;
  color:#e1e1e1;
  font-size:12px;
  line-height:1.9;
  white-space:pre-wrap;
}
.code{
  display:inline-block;
  margin-top:5px;
  padding:4px 10px;
  border:1px solid #303030;
  border-radius:5px;
  color:#aaa;
  background:#111;
  font-size:10px;
  direction:ltr;
}

/* إحصائيات وأزرار المتابعة */
.member-social{
  margin:0;
  padding:14px 16px 18px;
  border:0;
  border-radius:0;
  background:var(--bg);
  box-shadow:none;
}
.member-stats{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:0;
  margin-bottom:17px;
}
.member-stat{
  min-width:105px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  border:0;
  background:none;
  color:white;
  cursor:pointer;
}
.member-stat strong{
  font-size:19px;
  font-weight:900;
}
.member-stat span{
  color:#aaa;
  font-size:11px;
}
.member-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  max-width:390px;
  margin:auto;
}
.member-action{
  min-height:39px;
  flex:1;
  padding:7px 12px;
  border:1px solid #353535;
  border-radius:5px;
  background:#242424;
  color:white;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.member-action.primary{
  border-color:var(--pink);
  background:var(--pink);
  color:white;
}
.member-action:disabled{opacity:.6}
.member-request-box{
  margin-top:15px;
  padding:13px;
  border:1px solid #333;
  border-radius:9px;
  background:#151515;
}
.member-request-title{font-size:12px;font-weight:900;margin-bottom:8px}
.member-request-row{
  display:flex;justify-content:space-between;
  align-items:center;gap:8px;padding:8px 0;
  border-top:1px solid #292929;
}
.member-request-row span{font-size:11px}
.member-request-row button{
  border:0;border-radius:5px;padding:6px 10px;
  background:#333;color:white;font-size:10px;
}
.member-private-note{
  margin-top:12px;padding:12px;
  border:1px solid #333;border-radius:8px;
  color:#ccc;font-size:11px;line-height:2;
}

/* تبويبات الفيديوهات والمنشورات */
#memberMediaWrapper{margin-top:5px!important}
.member-tabs{
  position:sticky;
  top:58px;
  z-index:20;
  display:grid;
  grid-template-columns:1fr 1fr;
  height:49px;
  margin:0;
  border:0;
  border-bottom:1px solid #292929;
  background:#080808;
}
.member-tab{
  position:relative;
  border:0;
  background:none;
  color:#888;
  font-size:12px;
  font-weight:800;
}
.member-tab.active{color:white;border:0}
.member-tab.active:after{
  content:"";
  position:absolute;
  bottom:0;
  left:25%;
  width:50%;
  height:2px;
  background:white;
}
.member-media-section{
  margin:0!important;
  padding:2px 0!important;
  border:0!important;
  border-radius:0!important;
  background:var(--bg)!important;
}
.member-media-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:2px!important;
}
.member-media-item{
  position:relative;
  display:block;
  aspect-ratio:3/4;
  overflow:hidden;
  padding:0;
  border:0;
  border-radius:0!important;
  background:#1c1c1c;
  cursor:pointer;
}
.member-media-item img,.member-media-item video{
  width:100%;height:100%;object-fit:cover;
}
.member-media-text{
  display:grid;place-items:center;
  height:100%;padding:8px;
  color:#eee;font-size:10px;line-height:1.8;
}
.member-media-caption{
  position:absolute;right:0;left:0;bottom:0;
  padding:17px 5px 5px;
  overflow:hidden;
  background:linear-gradient(transparent,#000b);
  color:white;font-size:9px;
  white-space:nowrap;text-overflow:ellipsis;
}
.member-media-empty{
  grid-column:1/-1;
  padding:45px 10px;
  color:#888;
  font-size:12px;
  text-align:center;
}

/* عرض الوسائط */
.member-viewer{
  position:fixed;inset:0;z-index:10000;
  display:none;align-items:center;justify-content:center;
  padding:15px;background:#000f;
}
.member-viewer.open{display:flex}
.member-viewer img,.member-viewer video{
  max-width:100%;max-height:85dvh;object-fit:contain;
}
.member-viewer-close{
  position:absolute;top:18px;left:18px;
  width:40px;height:40px;
  border:0;border-radius:50%;
  background:#292929;color:white;font-size:23px;
}

/* قوائم المتابعين */
.member-list-modal{
  position:fixed;inset:0;z-index:10010;
  display:none;align-items:center;justify-content:center;
  padding:15px;background:#000d;
}
.member-list-modal.open{display:flex}
.member-list-box{
  width:min(100%,430px);max-height:80dvh;
  overflow:auto;padding:17px;
  border:1px solid #333;border-radius:13px;
  background:#171717;
}
.member-list-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:13px;
  font-size:14px;font-weight:900;
}
.member-list-close{
  width:32px;height:32px;border:0;
  border-radius:50%;background:#333;color:white;
}
.member-list-person{
  display:flex;align-items:center;gap:11px;
  padding:10px 0;border-bottom:1px solid #292929;
}
.member-list-person img,.member-list-avatar{
  width:42px;height:42px;display:grid;
  place-items:center;border-radius:50%;
  object-fit:cover;background:#333;
}
.member-list-person small{
  display:block;color:#999;font-size:10px;direction:ltr;
}
.member-list-empty{padding:20px;color:#999;text-align:center;font-size:12px}

/* إخفاء تفاصيل الهوايات القديمة من واجهة تيك توك */
#memberContent>.section{display:none!important}

#memberToast{
  font-family:Cairo,sans-serif!important;
  background:#252525!important;
  border:1px solid #444!important;
}

@media(min-width:700px){
  .container{border-left:1px solid #171717;border-right:1px solid #171717}
}
@media(max-width:380px){
  .member-stat{min-width:90px}
  .member-stat strong{font-size:17px}
  .card{padding-top:23px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<header class="topbar">
  <a href="../index.html" class="brand">HANOON<span>.</span></a>
  <div class="top-actions">
    <a href="../index.html" aria-label="الرئيسية">
      <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>
    </a>
  </div>
</header>

<main class="container">
  <div class="intro">
    <h1>الملف الشخصي</h1>
  </div>

  <div class="loading" id="loading">جارٍ تحميل الملف الشخصي...</div>
  <div class="error" id="error" role="alert"></div>

  <div id="memberContent" hidden>
    <section class="card">
      <div class="avatar" id="avatar">هـ</div>
      <h2 class="name" id="name"></h2>
      <div class="username" id="username"></div>
      <p class="bio" id="bio"></p>
      <div class="code" id="memberCode"></div>
    </section>

    <section class="section">
      <h3>الهوايات</h3>
      <div class="tags" id="hobbies"></div>
    </section>

    <section class="section">
      <h3>الاهتمامات القرائية</h3>
      <div class="tags" id="reading"></div>
    </section>
  </div>
</main>

<script type="module" src="../js/supabase-client.js"></script>
<script src="../js/member.js" defer></script>
</body>
</html>
