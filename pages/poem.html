
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="اقرأ القصائد واستمتع بالشعر والأدب في هنون.">
<title>قراءة القصيدة | هنون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080d1b;
  --panel:rgba(17,26,45,.88);
  --panel2:rgba(23,36,60,.82);
  --gold:#d8b56d;
  --gold2:#f6dfaa;
  --purple:#a58bff;
  --teal:#54d6c3;
  --text:#f5f1e8;
  --muted:#9ca9bd;
  --border:rgba(216,181,109,.2);
  --poem-size:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;min-height:100vh;overflow-x:hidden;color:var(--text);
  background:
    radial-gradient(ellipse at 82% 5%,rgba(165,139,255,.15),transparent 36%),
    radial-gradient(ellipse at 8% 42%,rgba(56,205,187,.09),transparent 34%),
    radial-gradient(ellipse at 50% 100%,rgba(216,181,109,.08),transparent 45%),
    var(--bg);
  font-family:"Cairo",sans-serif;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(216,181,109,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(216,181,109,.025) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(to bottom,black,transparent 90%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  opacity:.22;
  background:
    radial-gradient(circle at 12% 18%,transparent 0 65px,rgba(216,181,109,.12) 66px 67px,transparent 68px),
    radial-gradient(circle at 88% 72%,transparent 0 100px,rgba(165,139,255,.12) 101px 102px,transparent 103px);
}
body.light-mode{
  --bg:#f5f0e5;--panel:rgba(255,250,240,.92);
  --panel2:rgba(238,229,213,.9);--text:#282437;
  --muted:#766f7e;--border:rgba(115,88,47,.2);
  background:#f5f0e5;
}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:min(940px,100%);margin:auto;padding:20px 18px 65px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;
  color:#171421;border-radius:15px;
  background:linear-gradient(145deg,var(--gold2),#b58a42);
  font-size:24px;font-weight:900;
  box-shadow:0 8px 25px rgba(216,181,109,.2);
}
.brand-name{font-size:19px;font-weight:900}
.brand-caption{margin-top:-5px;color:var(--muted);font-size:10px}
.back-link{
  padding:9px 14px;color:var(--gold2);
  border:1px solid var(--border);border-radius:12px;
  background:rgba(255,255,255,.035);font-size:12px;
  transition:.2s;
}
.back-link:hover{background:rgba(216,181,109,.1);border-color:var(--gold)}
.breadcrumb{margin:0 0 17px;color:var(--muted);font-size:12px}
.breadcrumb a{color:var(--gold2)}
.poem-card{
  position:relative;overflow:hidden;
  border:1px solid var(--border);border-radius:28px;
  background:
    radial-gradient(circle at 100% 0%,rgba(165,139,255,.13),transparent 34%),
    radial-gradient(circle at 0% 100%,rgba(56,205,187,.07),transparent 35%),
    linear-gradient(145deg,var(--panel2),var(--panel));
  box-shadow:0 25px 70px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.035);
  backdrop-filter:blur(18px);
}
.poem-card::before{
  content:"";position:absolute;inset:10px;
  border:1px solid rgba(216,181,109,.07);
  border-radius:20px;pointer-events:none;
}
.poem-header{
  position:relative;padding:38px 30px 28px;text-align:center;
  border-bottom:1px solid var(--border);
}
.poem-category{
  display:inline-block;padding:7px 16px;color:var(--gold2);
  border:1px solid rgba(216,181,109,.3);border-radius:30px;
  background:rgba(216,181,109,.09);font-size:11px;font-weight:800;
}
.poem-title{
  margin:18px 0 8px;font-size:clamp(26px,5vw,42px);
  font-weight:900;line-height:1.6;
  background:linear-gradient(120deg,#fff7e6,var(--gold2),#d5c7ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.poem-subtitle{margin:0;color:var(--muted);font-size:12px;line-height:2}
.poem-author{margin-top:17px;color:var(--gold2);font-size:12px;font-weight:800}
.poem-details{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:18px}
.detail-chip{
  padding:6px 12px;color:var(--muted);
  border:1px solid var(--border);border-radius:30px;
  background:rgba(255,255,255,.025);font-size:10px;
}
.tools{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:8px;padding:16px;border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.09);
}
.tool-btn{
  min-width:41px;min-height:39px;padding:7px 12px;
  color:var(--text);border:1px solid var(--border);
  border-radius:11px;background:rgba(255,255,255,.035);
  font-size:12px;transition:.2s;
}
.tool-btn:hover{border-color:var(--gold);background:rgba(216,181,109,.1)}
.tool-btn.active{color:var(--gold2);border-color:rgba(216,181,109,.5);background:rgba(216,181,109,.1)}
.tool-btn.favorite.active{color:#ff8193;border-color:rgba(255,129,147,.4);background:rgba(255,129,147,.08)}
.font-control{
  display:flex;align-items:center;gap:5px;padding:3px;
  border:1px solid var(--border);border-radius:12px;
  background:rgba(255,255,255,.025);
}
.font-control span{padding:0 5px;color:var(--muted);font-size:10px}
.font-control button{
  width:29px;height:29px;color:var(--text);border:0;
  border-radius:8px;background:transparent;font-weight:900;
}
.font-control button:hover{color:var(--gold2);background:rgba(216,181,109,.1)}
.audio-panel{
  margin:19px 22px 0;padding:16px;
  border:1px solid rgba(84,214,195,.22);border-radius:17px;
  background:linear-gradient(120deg,rgba(84,214,195,.07),rgba(84,214,195,.025));
}
.audio-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.audio-title{color:var(--teal);font-size:12px;font-weight:800}
.audio-status{color:var(--muted);font-size:10px}
.audio-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.audio-btn{
  min-height:38px;padding:7px 14px;color:var(--text);
  border:1px solid rgba(84,214,195,.23);border-radius:11px;
  background:rgba(84,214,195,.08);font-size:11px;font-weight:800;
}
.audio-btn.main{color:#09201d;border:0;background:var(--teal)}
.audio-btn:disabled{opacity:.4;cursor:not-allowed}
.audio-progress{height:4px;overflow:hidden;margin-top:13px;border-radius:10px;background:rgba(255,255,255,.08)}
.audio-progress-fill{width:0%;height:100%;border-radius:inherit;background:var(--teal);transition:width .2s}
.poem-content{position:relative;padding:38px 25px 43px;text-align:center}
.poem-content::before,.poem-content::after{content:"✦";display:block;color:var(--gold);opacity:.7;font-size:18px}
.poem-lines{
  display:flex;flex-direction:column;align-items:center;gap:13px;
  margin:25px auto;font-size:var(--poem-size);
  font-weight:600;line-height:2.1;
}
.poem-line{
  width:100%;max-width:680px;padding:5px 8px;border-radius:10px;
  transition:background .2s,color .2s;overflow-wrap:anywhere;
}
.poem-line.current-line{color:var(--gold2);background:rgba(216,181,109,.1)}
.poem-end{margin-top:22px;color:var(--gold);font-size:22px;letter-spacing:8px}
.poem-navigation{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:20px;padding:19px;border-top:1px solid var(--border);
}
.nav-poem{
  min-width:110px;padding:10px 13px;color:var(--text);
  border:1px solid var(--border);border-radius:12px;
  background:rgba(255,255,255,.035);font-size:11px;font-weight:700;
}
.nav-poem:hover:not(:disabled){border-color:var(--gold);background:rgba(216,181,109,.08)}
.nav-poem:disabled{opacity:.35;cursor:not-allowed}
.nav-counter{color:var(--muted);font-size:10px;text-align:center}
.loading-state,.error-state{padding:65px 20px;text-align:center;color:var(--muted)}
.error-state h2{color:var(--text);font-size:20px}
.error-state p{font-size:12px;line-height:2}
.error-state a{
  display:inline-block;margin-top:12px;padding:10px 18px;
  color:#171421;border-radius:12px;background:var(--gold2);
  font-size:12px;font-weight:800;
}
.toast{
  position:fixed;z-index:20;right:50%;bottom:22px;
  max-width:calc(100% - 30px);padding:11px 17px;color:white;
  border:1px solid rgba(216,181,109,.3);border-radius:12px;
  background:#202b40;box-shadow:0 10px 30px rgba(0,0,0,.3);
  font-size:12px;opacity:0;pointer-events:none;
  transform:translate(50%,15px);transition:.25s;
}
.toast.show{opacity:1;transform:translate(50%,0)}
.footer{padding:25px 10px 0;color:var(--muted);text-align:center;font-size:10px}
@media(max-width:600px){
  .page{padding:14px 11px 45px}
  .poem-header{padding:28px 15px 21px}
  .poem-content{padding:28px 12px 33px}
  .poem-lines{gap:10px;line-height:2}
  .tools{gap:6px;padding:11px 7px}
  .tool-btn{min-height:36px;padding:6px 9px;font-size:10px}
  .audio-panel{margin:13px 10px 0;padding:12px}
  .poem-navigation{padding:13px 9px}
  .nav-poem{min-width:87px;padding:9px 7px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>
<main class="page">
  <header class="topbar">
    <a href="../index.html" class="brand">
      <div class="brand-mark">هـ</div>
      <div>
        <div class="brand-name">هنون</div>
        <div class="brand-caption">مساحة الكلمة والإبداع</div>
      </div>
    </a>
    <a href="poetry.html" class="back-link">← مكتبة الشعر</a>
  </header>

  <div class="breadcrumb">
    <a href="poetry.html">الشعر والأدب</a>
    <span> / </span>
    <span id="breadcrumbCollection">قراءة القصيدة</span>
  </div>

  <section class="poem-card" id="poemCard">
    <div class="loading-state" id="loadingState">جارٍ تحميل القصيدة...</div>
  </section>

  <footer class="footer">هنون — الكلمة الجميلة تفضل عايشة</footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../data/poetry-01.js"></script>
<script src="../data/poetry-02.js"></script>
<script src="../data/poetry-03.js"></script>
<script src="../data/poetry-04.js"></script>
<script src="../data/poetry.js"></script>

<script>
(() => {
"use strict";

const API = window.HANOON_POETRY_API;
const params = new URLSearchParams(window.location.search);
const requestedId = params.get("id");
const requestedCollection = params.get("collection");
const card = document.getElementById("poemCard");
const toast = document.getElementById("toast");

let poem = null;
let collection = null;
let poems = [];
let poemIndex = -1;
let fontSize = 20;
let speechState = "idle";
let speechLines = [];
let speechIndex = 0;
let toastTimer = null;

const canSpeak = "speechSynthesis" in window &&
  "SpeechSynthesisUtterance" in window;

const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[char]);

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"),2400);
}

function number(value){
  return new Intl.NumberFormat("ar-EG").format(value);
}

function categoryLabel(category){
  const labels = {
    love:"الحب والعشق",romance:"الحب والعشق",
    separation:"الفراق والغياب",nostalgia:"الحنين والذكريات",
    friendship:"الصحاب والجدعنة",mother:"الأم",father:"الأب",
    family:"العيلة",life:"الحياة",ambition:"الطموح",
    success:"النجاح",pain:"الوجع والخذلان",patience:"الصبر",
    hope:"الأمل",exile:"الغربة",street:"الشارع",
    dignity:"الكرامة",youth:"الشباب",homeland:"الوطن",
    wisdom:"الحكمة",humor:"الضحك وخفة الدم"
  };
  return labels[category] || category || "شعر";
}

function getAllPoems(){
  return API && typeof API.getAllPoems === "function" ? API.getAllPoems() : [];
}

function getCollectionByPoem(target){
  if(!target || !API || typeof API.getAllCollections !== "function") return null;
  return API.getAllCollections().find(item =>
    (item.poems || []).some(entry => entry.id === target.id)
  ) || null;
}

function findPoem(){
  if(!API) return null;
  if(requestedId && typeof API.getPoemById === "function"){
    return API.getPoemById(requestedId);
  }
  if(requestedCollection && typeof API.getPoemsByCollection === "function"){
    const items = API.getPoemsByCollection(requestedCollection);
    return items && items.length ? items[0] : null;
  }
  return null;
}

function isFavorite(){
  return !!(API && typeof API.isFavorite === "function" &&
    poem && API.isFavorite(poem.id));
}

function stopSpeech(){
  if(canSpeak) window.speechSynthesis.cancel();
  speechState = "idle";
  speechIndex = 0;
  updateAudioUI();
  highlightLine(-1);
}

function updateAudioUI(){
  const status = document.getElementById("audioStatus");
  const playButton = document.getElementById("audioPlay");
  const pauseButton = document.getElementById("audioPause");
  const progress = document.getElementById("audioProgress");
  if(!status || !playButton || !pauseButton) return;

  const total = speechLines.length || 1;
  const percentage = speechState === "ended" ? 100 :
    Math.round((speechIndex / total) * 100);

  if(speechState === "playing"){
    status.textContent = "جاري قراءة القصيدة";
    playButton.textContent = "إعادة القراءة";
    pauseButton.disabled = false;
  }else if(speechState === "paused"){
    status.textContent = "القراءة متوقفة مؤقتًا";
    playButton.textContent = "استكمال";
    pauseButton.disabled = true;
  }else if(speechState === "ended"){
    status.textContent = "انتهت القراءة";
    playButton.textContent = "استمع مرة أخرى";
    pauseButton.disabled = true;
  }else{
    status.textContent = canSpeak ? "جاهز للاستماع" : "القراءة الصوتية غير مدعومة";
    playButton.textContent = "استمع للقصيدة";
    pauseButton.disabled = true;
  }

  if(progress) progress.style.width = percentage + "%";
  playButton.disabled = !canSpeak;
}

function highlightLine(index){
  document.querySelectorAll(".poem-line").forEach((line,i) => {
    line.classList.toggle("current-line",i === index);
  });
  if(index >= 0){
    const line = document.querySelectorAll(".poem-line")[index];
    if(line) line.scrollIntoView({behavior:"smooth",block:"center"});
  }
}

function speakNextLine(){
  if(!canSpeak || speechState !== "playing") return;

  if(speechIndex >= speechLines.length){
    speechState = "ended";
    updateAudioUI();
    highlightLine(-1);
    return;
  }

  const utterance = new SpeechSynthesisUtterance(speechLines[speechIndex]);
  utterance.lang = "ar-EG";
  utterance.rate = .88;
  utterance.pitch = 1;
  utterance.volume = 1;

  highlightLine(speechIndex);
  updateAudioUI();

  utterance.onend = () => {
    if(speechState !== "playing") return;
    speechIndex++;
    speakNextLine();
  };

  utterance.onerror = event => {
    if(event.error === "interrupted" || event.error === "canceled") return;
    speechState = "idle";
    updateAudioUI();
    showToast("حصلت مشكلة أثناء تشغيل الصوت.");
  };

  window.speechSynthesis.speak(utterance);
}

function playSpeech(){
  if(!canSpeak){
    showToast("المتصفح لا يدعم القراءة الصوتية.");
    return;
  }

  if(speechState === "paused"){
    speechState = "playing";
    window.speechSynthesis.resume();
    updateAudioUI();
    return;
  }

  if(speechState === "playing"){
    stopSpeech();
    return;
  }

  if(speechState === "ended") speechIndex = 0;

  speechLines = (poem.lines || [])
    .map(line => String(line).trim())
    .filter(Boolean);

  if(!speechLines.length){
    showToast("لا توجد أسطر متاحة للقراءة.");
    return;
  }

  window.speechSynthesis.cancel();
  speechState = "playing";
  speechIndex = 0;
  speakNextLine();
}

function pauseSpeech(){
  if(!canSpeak || speechState !== "playing") return;
  window.speechSynthesis.pause();
  speechState = "paused";
  updateAudioUI();
}

function toggleFavorite(){
  if(!API || !poem) return;

  if(typeof API.toggleFavorite === "function"){
    API.toggleFavorite(poem.id);
  }else if(typeof API.addFavorite === "function" &&
           typeof API.removeFavorite === "function"){
    if(isFavorite()) API.removeFavorite(poem.id);
    else API.addFavorite(poem.id);
  }else{
    showToast("خدمة المفضلة غير متاحة في ملف البيانات.");
    return;
  }

  updateFavoriteButton();
  showToast(isFavorite() ? "اتضافت للمفضلة ♥" : "اتشالت من المفضلة");
}

function updateFavoriteButton(){
  const button = document.getElementById("favoriteButton");
  if(!button) return;
  button.classList.toggle("active",isFavorite());
  button.textContent = isFavorite() ? "♥ في المفضلة" : "♡ أضف للمفضلة";
}

async function sharePoem(){
  if(!poem) return;
  const text = `${poem.title}\n${(poem.lines || []).join("\n")}\n\nYousef Elgorf`;
  try{
    if(navigator.share){
      await navigator.share({title:poem.title,text,url:window.location.href});
    }else if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text + "\n" + window.location.href);
      showToast("تم نسخ القصيدة ورابطها.");
    }else{
      showToast("المشاركة غير متاحة على هذا المتصفح.");
    }
  }catch(error){
    if(error && error.name !== "AbortError") showToast("تعذرت المشاركة.");
  }
}

function changeFont(amount){
  fontSize = Math.min(30,Math.max(14,fontSize + amount));
  document.documentElement.style.setProperty("--poem-size",fontSize + "px");
}

function toggleTheme(){
  document.body.classList.toggle("light-mode");
  const button = document.getElementById("themeButton");
  if(button){
    const light = document.body.classList.contains("light-mode");
    button.classList.toggle("active",light);
    button.textContent = light ? "☾ الوضع الداكن" : "☼ الوضع الفاتح";
  }
}

function navigatePoem(direction){
  if(poemIndex < 0 || !poems.length) return;
  const nextIndex = poemIndex + direction;
  if(nextIndex < 0 || nextIndex >= poems.length) return;
  stopSpeech();
  const nextPoem = poems[nextIndex];
  if(nextPoem){
    window.location.href = `poem.html?id=${encodeURIComponent(nextPoem.id)}`;
  }
}

function renderPoem(){
  if(!poem){
    card.innerHTML = `
      <div class="error-state">
        <h2>القصيدة مش موجودة</h2>
        <p>ممكن تكون القصيدة اتحذفت أو الرابط غير صحيح، أو ملفات الدواوين لسه ما اتحملتش.</p>
        <a href="poetry.html">العودة لمكتبة الشعر</a>
      </div>`;
    return;
  }

  collection = getCollectionByPoem(poem);
  poems = collection ? collection.poems : getAllPoems();
  poemIndex = poems.findIndex(item => item.id === poem.id);

  const lines = Array.isArray(poem.lines) ? poem.lines : [];
  const lineMarkup = lines.length
    ? lines.map((line,index) => `
        <div class="poem-line" data-line="${index}">${escapeHTML(line)}</div>
      `).join("")
    : `<div class="empty-state">لا توجد أسطر في هذه القصيدة.</div>`;

  document.title = `${poem.title} | هنون`;
  document.getElementById("breadcrumbCollection").textContent =
    collection?.title || "قراءة القصيدة";

  card.innerHTML = `
    <header class="poem-header">
      <span class="poem-category">${escapeHTML(categoryLabel(poem.category || collection?.category))}</span>
      <h1 class="poem-title">${escapeHTML(poem.title)}</h1>
      <p class="poem-subtitle">${escapeHTML(poem.description || "قصيدة من مكتبة هنون للشعر والأدب.")}</p>
      <div class="poem-author">بقلم ${escapeHTML(collection?.author || "Yousef Elgorf")}</div>
      <div class="poem-details">
        ${collection ? `<span class="detail-chip">الديوان: ${escapeHTML(collection.title)}</span>` : ""}
        ${poem.rhyme ? `<span class="detail-chip">القافية: ${escapeHTML(poem.rhyme)}</span>` : ""}
        ${poem.rhythm ? `<span class="detail-chip">الإيقاع: ${escapeHTML(poem.rhythm)}</span>` : ""}
        <span class="detail-chip">${number(lines.length)} سطر</span>
      </div>
    </header>

    <div class="tools">
      <button class="tool-btn favorite" id="favoriteButton" type="button">♡ أضف للمفضلة</button>
      <button class="tool-btn" id="shareButton" type="button">↗ مشاركة</button>
      <div class="font-control">
        <span>حجم الخط</span>
        <button id="fontDown" type="button" aria-label="تصغير الخط">−</button>
        <button id="fontUp" type="button" aria-label="تكبير الخط">+</button>
      </div>
      <button class="tool-btn" id="themeButton" type="button">☼ الوضع الفاتح</button>
    </div>

    <section class="audio-panel">
      <div class="audio-top">
        <span class="audio-title">♫ الاستماع للقصيدة</span>
        <span class="audio-status" id="audioStatus">جاهز للاستماع</span>
      </div>
      <div class="audio-controls">
        <button class="audio-btn main" id="audioPlay" type="button">استمع للقصيدة</button>
        <button class="audio-btn" id="audioPause" type="button" disabled>إيقاف مؤقت</button>
        <button class="audio-btn" id="audioStop" type="button">إيقاف</button>
      </div>
      <div class="audio-progress">
        <div class="audio-progress-fill" id="audioProgress"></div>
      </div>
    </section>

    <article class="poem-content">
      <div class="poem-lines">${lineMarkup}</div>
      <div class="poem-end">✦ ✧ ✦</div>
    </article>

    <nav class="poem-navigation" aria-label="التنقل بين القصائد">
      <button class="nav-poem" id="previousPoem" type="button">→ القصيدة السابقة</button>
      <span class="nav-counter">${poemIndex >= 0 ? `${number(poemIndex + 1)} / ${number(poems.length)}` : ""}</span>
      <button class="nav-poem" id="nextPoem" type="button">القصيدة التالية ←</button>
    </nav>
  `;

  updateFavoriteButton();
  updateAudioUI();

  document.getElementById("favoriteButton").addEventListener("click",toggleFavorite);
  document.getElementById("shareButton").addEventListener("click",sharePoem);
  document.getElementById("fontDown").addEventListener("click",() => changeFont(-1));
  document.getElementById("fontUp").addEventListener("click",() => changeFont(1));
  document.getElementById("themeButton").addEventListener("click",toggleTheme);
  document.getElementById("audioPlay").addEventListener("click",playSpeech);
  document.getElementById("audioPause").addEventListener("click",pauseSpeech);
  document.getElementById("audioStop").addEventListener("click",stopSpeech);

  document.getElementById("previousPoem").disabled = poemIndex <= 0;
  document.getElementById("nextPoem").disabled =
    poemIndex < 0 || poemIndex >= poems.length - 1;

  document.getElementById("previousPoem").addEventListener("click",() => navigatePoem(-1));
  document.getElementById("nextPoem").addEventListener("click",() => navigatePoem(1));
}

function initialize(){
  if(!API){
    card.innerHTML = `
      <div class="error-state">
        <h2>تعذر تحميل مكتبة الشعر</h2>
        <p>تأكد من تحميل ملفات البيانات الأربعة وملف poetry.js المركزي بالترتيب الصحيح.</p>
        <a href="poetry.html">العودة للمكتبة</a>
      </div>`;
    return;
  }
  poem = findPoem();
  renderPoem();
}

window.addEventListener("beforeunload",() => {
  if(canSpeak) window.speechSynthesis.cancel();
});

initialize();

window.addEventListener("hanoon:poetry-ready",() => {
  if(!poem) initialize();
});

})();
</script>
</body>
</html>
