
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C1020">
<meta name="description" content="قارئ القصائد في مكتبة هنون للشعر والأدب.">
<title>قراءة القصيدة | HANOON</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/fixed-viewport.css">

<style>
:root{
  --gold:#D5B36C;
  --gold-light:#F1D99C;
  --purple:#8C75F5;
  --teal:#35BDB0;
  --bg:#0C1020;
  --surface:#171D32;
  --surface2:#202840;
  --text:#F5EAD1;
  --muted:#A8AEC2;
  --border:rgba(255,255,255,.09);
  --poem-size:21px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  min-height:0;
  margin:0;
  overflow:hidden;
}

body{
  color:var(--text);
  background:var(--bg);
  font-family:"Cairo",sans-serif;
}

button,a{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app-shell{
  position:relative;
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  background:
    linear-gradient(rgba(12,16,32,.84),rgba(12,16,32,.95)),
    url("../assets/backgrounds/books-bg.svg") center center/cover no-repeat;
}

.app-shell::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 85% 5%,rgba(140,117,245,.12),transparent 38%),
    radial-gradient(ellipse at 5% 45%,rgba(53,189,176,.08),transparent 35%),
    radial-gradient(ellipse at 50% 100%,rgba(213,179,108,.06),transparent 45%);
}

.app-shell::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.2;
  background-image:
    linear-gradient(rgba(213,179,108,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(213,179,108,.025) 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,black,transparent 95%);
}

/* الشريط العلوي */

.topbar{
  position:relative;
  z-index:10;
  flex-shrink:0;
  min-height:68px;
  padding:9px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(12,16,32,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  color:var(--gold);
}

.brand-mark{
  width:42px;
  height:42px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:13px;
  color:#171525;
  background:linear-gradient(135deg,#e7cb8a,#8b6937);
  font-size:23px;
  font-weight:900;
  box-shadow:0 5px 22px rgba(213,179,108,.2);
}

.brand-info{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.brand-name{
  font-size:19px;
  font-weight:900;
  letter-spacing:1px;
}

.brand-caption{
  margin-top:-5px;
  color:var(--muted);
  font-size:9px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.top-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:37px;
  padding:7px 13px;
  border:1px solid rgba(213,179,108,.35);
  border-radius:11px;
  color:var(--gold);
  background:rgba(255,255,255,.025);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  transition:.2s;
}

.top-link:hover{
  background:rgba(213,179,108,.1);
  border-color:var(--gold);
}

/* منطقة التمرير */

.content-scroll{
  position:relative;
  z-index:1;
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:rgba(213,179,108,.4) transparent;
}

.content-scroll::-webkit-scrollbar{
  width:5px;
}

.content-scroll::-webkit-scrollbar-thumb{
  background:rgba(213,179,108,.4);
  border-radius:10px;
}

.container{
  width:min(1000px,92%);
  margin:auto;
  padding:17px 0 35px;
}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  margin:2px 0 15px;
  color:var(--muted);
  font-size:10px;
}

.breadcrumb a{
  color:var(--gold);
}

.breadcrumb span:last-child{
  color:var(--text);
}

/* بطاقة القصيدة */

.reader-card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(213,179,108,.25);
  border-radius:23px;
  background:
    radial-gradient(circle at 100% 0%,rgba(140,117,245,.13),transparent 36%),
    radial-gradient(circle at 0% 100%,rgba(53,189,176,.07),transparent 35%),
    linear-gradient(145deg,rgba(31,39,63,.97),rgba(17,25,44,.97));
  box-shadow:0 22px 55px rgba(0,0,0,.28);
}

.reader-card::before{
  content:"";
  position:absolute;
  inset:9px;
  z-index:0;
  border:1px solid rgba(213,179,108,.08);
  border-radius:17px;
  pointer-events:none;
}

.reader-card > *{
  position:relative;
  z-index:1;
}

/* رأس القصيدة */

.poem-header{
  padding:28px 25px 23px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

.poem-category{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 15px;
  border:1px solid rgba(53,189,176,.3);
  border-radius:30px;
  color:var(--teal);
  background:rgba(53,189,176,.08);
  font-size:10px;
  font-weight:900;
}

.poem-title{
  margin:13px 0 6px;
  color:var(--text);
  font-size:clamp(25px,4.5vw,39px);
  line-height:1.6;
  font-weight:900;
}

.poem-description{
  max-width:650px;
  margin:0 auto;
  color:var(--muted);
  font-size:11px;
  line-height:2;
}

.author-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  margin-top:16px;
}

.author-avatar{
  width:34px;
  height:34px;
  object-fit:cover;
  border:2px solid var(--gold);
  border-radius:50%;
  background:var(--surface2);
}

.author-name{
  color:var(--gold-light);
  font-size:11px;
  font-weight:900;
}

.author-caption{
  color:var(--muted);
  font-size:8px;
}

.meta-row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:15px;
}

.meta-chip{
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:25px;
  color:var(--muted);
  background:rgba(255,255,255,.025);
  font-size:9px;
}

/* شريط الأدوات */

.tools-bar{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  background:rgba(19,27,46,.96);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.tool-btn{
  min-height:36px;
  padding:6px 11px;
  border:1px solid rgba(213,179,108,.2);
  border-radius:10px;
  color:var(--text);
  background:rgba(255,255,255,.035);
  font-size:10px;
  font-weight:800;
  transition:.2s;
}

.tool-btn:hover,
.tool-btn.active{
  color:var(--gold-light);
  border-color:rgba(213,179,108,.55);
  background:rgba(213,179,108,.1);
}

.tool-btn.favorite.active{
  color:#ff8b9c;
  border-color:rgba(255,139,156,.4);
  background:rgba(255,139,156,.08);
}

.font-control{
  display:flex;
  align-items:center;
  gap:3px;
  padding:3px 5px;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,.025);
}

.font-control span{
  padding:0 5px;
  color:var(--muted);
  font-size:9px;
}

.font-control button{
  width:27px;
  height:27px;
  border:0;
  border-radius:7px;
  color:var(--text);
  background:transparent;
  font-size:16px;
  font-weight:900;
}

.font-control button:hover{
  color:var(--gold);
  background:rgba(213,179,108,.1);
}

/* لوحة الاستماع */

.audio-panel{
  margin:17px 20px 0;
  padding:14px;
  border:1px solid rgba(53,189,176,.23);
  border-radius:15px;
  background:
    linear-gradient(120deg,rgba(53,189,176,.08),rgba(53,189,176,.025));
}

.audio-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:11px;
}

.audio-title{
  color:var(--teal);
  font-size:11px;
  font-weight:900;
}

.audio-status{
  color:var(--muted);
  font-size:9px;
}

.audio-controls{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}

.audio-btn{
  min-height:35px;
  padding:7px 13px;
  border:1px solid rgba(53,189,176,.25);
  border-radius:9px;
  color:var(--text);
  background:rgba(53,189,176,.07);
  font-size:10px;
  font-weight:800;
}

.audio-btn.main{
  color:#09201d;
  border-color:transparent;
  background:linear-gradient(135deg,#69E1D4,#35BDB0);
}

.audio-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.audio-progress{
  height:4px;
  overflow:hidden;
  margin-top:12px;
  border-radius:10px;
  background:rgba(255,255,255,.08);
}

.audio-progress-fill{
  width:0;
  height:100%;
  border-radius:inherit;
  background:var(--teal);
  transition:width .2s;
}

/* مساحة القصيدة */

.poem-content{
  position:relative;
  padding:30px 25px 36px;
  text-align:center;
}

.poem-decoration{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  color:var(--gold);
  opacity:.75;
  font-size:15px;
}

.poem-decoration::before,
.poem-decoration::after{
  content:"";
  width:50px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}

.poem-decoration::after{
  transform:rotate(180deg);
}

.poem-lines{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  width:100%;
  margin:23px auto;
  font-size:var(--poem-size);
  font-weight:600;
  line-height:2.15;
}

.poem-line{
  width:100%;
  max-width:700px;
  padding:5px 9px;
  border-radius:9px;
  color:var(--text);
  overflow-wrap:anywhere;
  transition:background .2s,color .2s;
}

.poem-line.current-line{
  color:var(--gold-light);
  background:rgba(213,179,108,.11);
}

.poem-line-number{
  display:inline-block;
  min-width:22px;
  margin-left:7px;
  color:rgba(213,179,108,.45);
  font-size:9px;
  vertical-align:middle;
}

.poem-end{
  margin-top:20px;
  color:var(--gold);
  font-size:17px;
  letter-spacing:7px;
}

/* التنقل */

.poem-navigation{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:16px;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,.08);
}

.nav-poem{
  min-width:115px;
  min-height:38px;
  padding:8px 12px;
  border:1px solid rgba(213,179,108,.25);
  border-radius:10px;
  color:var(--text);
  background:rgba(255,255,255,.035);
  font-size:10px;
  font-weight:800;
  transition:.2s;
}

.nav-poem:hover:not(:disabled){
  border-color:var(--gold);
  background:rgba(213,179,108,.09);
}

.nav-poem:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.nav-counter{
  color:var(--muted);
  font-size:9px;
  text-align:center;
  white-space:nowrap;
}

/* حالات التحميل والخطأ */

.loading-state,
.error-state{
  padding:55px 17px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:2;
}

.loading-spinner{
  width:28px;
  height:28px;
  margin:0 auto 13px;
  border:3px solid rgba(213,179,108,.15);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error-state h2{
  margin:0 0 9px;
  color:var(--gold);
  font-size:19px;
}

.error-state p{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:2;
}

.error-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:37px;
  margin-top:13px;
  padding:7px 15px;
  border-radius:10px;
  color:#171525;
  background:linear-gradient(135deg,#e7cb8a,#b28b4d);
  font-size:10px;
  font-weight:900;
}

/* التذييل والإشعارات */

.footer{
  padding:20px 10px 12px;
  color:var(--muted);
  text-align:center;
  font-size:9px;
}

.footer strong{
  color:var(--gold);
}

.toast{
  position:fixed;
  z-index:100;
  right:50%;
  bottom:20px;
  width:max-content;
  max-width:calc(100% - 28px);
  padding:10px 16px;
  border:1px solid rgba(213,179,108,.3);
  border-radius:11px;
  color:white;
  background:#202b40;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  font-size:10px;
  opacity:0;
  pointer-events:none;
  transform:translate(50%,15px);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(50%,0);
}

/* الوضع الفاتح */

body.light-mode .app-shell{
  background:
    linear-gradient(rgba(245,240,229,.86),rgba(245,240,229,.96)),
    url("../assets/backgrounds/books-bg.svg") center center/cover no-repeat;
}

body.light-mode .topbar{
  background:rgba(245,240,229,.96);
}

body.light-mode .reader-card{
  background:
    radial-gradient(circle at 100% 0%,rgba(140,117,245,.08),transparent 36%),
    linear-gradient(145deg,#fffaf0,#eee5d5);
  border-color:rgba(115,88,47,.2);
}

body.light-mode .poem-title,
body.light-mode .poem-line,
body.light-mode .tool-btn,
body.light-mode .nav-poem{
  color:#282437;
}

body.light-mode .poem-description,
body.light-mode .breadcrumb,
body.light-mode .meta-chip,
body.light-mode .audio-status,
body.light-mode .nav-counter{
  color:#766f7e;
}

body.light-mode .tools-bar{
  background:rgba(245,240,229,.96);
}

body.light-mode .poem-navigation{
  background:rgba(115,88,47,.035);
}

body.light-mode .poem-line.current-line{
  color:#72521d;
  background:rgba(213,179,108,.18);
}

/* الموبايل */

@media(max-width:700px){
  .topbar{
    min-height:59px;
    padding:7px 4%;
  }

  .brand-mark{
    width:36px;
    height:36px;
    border-radius:11px;
    font-size:20px;
  }

  .brand-name{
    font-size:16px;
  }

  .brand-caption{
    font-size:8px;
  }

  .top-link{
    min-height:33px;
    padding:6px 9px;
    font-size:9px;
  }

  .container{
    width:94%;
    padding-top:12px;
  }

  .reader-card{
    border-radius:17px;
  }

  .poem-header{
    padding:22px 13px 18px;
  }

  .poem-title{
    font-size:23px;
  }

  .poem-description{
    font-size:10px;
  }

  .tools-bar{
    gap:5px;
    padding:9px 5px;
  }

  .tool-btn{
    min-height:33px;
    padding:5px 8px;
    font-size:9px;
  }

  .font-control span{
    font-size:8px;
  }

  .font-control button{
    width:24px;
    height:25px;
  }

  .audio-panel{
    margin:12px 9px 0;
    padding:11px;
  }

  .audio-btn{
    min-height:33px;
    padding:6px 10px;
    font-size:9px;
  }

  .poem-content{
    padding:23px 10px 28px;
  }

  .poem-lines{
    gap:9px;
    line-height:2.05;
    margin:18px auto;
  }

  .poem-line{
    padding:4px 3px;
  }

  .poem-navigation{
    padding:12px 8px;
  }

  .nav-poem{
    min-width:87px;
    min-height:34px;
    padding:6px;
    font-size:9px;
  }
}

@media(max-width:370px){
  .brand-caption{
    display:none;
  }

  .poem-title{
    font-size:20px;
  }

  .tool-btn{
    padding:5px 6px;
    font-size:8px;
  }

  .nav-poem{
    min-width:78px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="app-shell">

  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="brand-mark">هـ</span>
      <span class="brand-info">
        <span class="brand-name">HANOON</span>
        <span class="brand-caption">مكتبة المعرفة والأدب</span>
      </span>
    </a>

    <div class="top-actions">
      <a class="top-link" id="backToCollection" href="poetry.html">
        العودة للديوان ←
      </a>
      <a class="top-link" href="poetry.html">
        المكتبة
      </a>
    </div>
  </header>

  <div class="content-scroll" id="contentScroll">

    <main class="container">

      <div class="breadcrumb">
        <a href="../index.html">الرئيسية</a>
        <span>/</span>
        <a href="poetry.html">مكتبة الشعر</a>
        <span>/</span>
        <span id="breadcrumbCollection">قراءة القصيدة</span>
      </div>

      <section class="reader-card" id="poemCard">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          جارٍ تجهيز القصيدة...
        </div>
      </section>

      <footer class="footer">
        <strong>HANOON</strong> — الكلمة الجميلة تفضل عايشة
      </footer>

    </main>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../data/poetry-01.js"></script>
<script src="../data/poetry-02.js"></script>
<script src="../data/poetry-03.js"></script>
<script src="../data/poetry-04.js"></script>
<script src="../data/poetry.js"></script>

<script>
(function(){
"use strict";

/* ===============================
   العناصر والبيانات
=============================== */

const API = window.HANOON_POETRY_API;
const params = new URLSearchParams(window.location.search);

const requestedId = params.get("id");
const requestedCollection = params.get("collection");

const card = document.getElementById("poemCard");
const toast = document.getElementById("toast");
const contentScroll = document.getElementById("contentScroll");
const backToCollection = document.getElementById("backToCollection");

let poem = null;
let collection = null;
let poems = [];
let poemIndex = -1;

let fontSize = 21;
let speechState = "idle";
let speechLines = [];
let speechIndex = 0;

let toastTimer = null;

const canSpeak =
  "speechSynthesis" in window &&
  "SpeechSynthesisUtterance" in window;


/* ===============================
   أدوات مساعدة
=============================== */

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function number(value){
  return new Intl.NumberFormat("ar-EG").format(value);
}

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(function(){
    toast.classList.remove("show");
  },2400);
}

function categoryLabel(category){
  const labels = {
    love:"الحب والعشق",
    romance:"الحب والعشق",
    separation:"الفراق والغياب",
    nostalgia:"الحنين والذكريات",
    friendship:"الصحاب والجدعنة",
    mother:"الأم",
    father:"الأب",
    family:"العيلة",
    life:"الحياة",
    ambition:"الطموح",
    success:"النجاح",
    pain:"الوجع والخذلان",
    patience:"الصبر",
    hope:"الأمل",
    exile:"الغربة",
    street:"الشارع",
    dignity:"الكرامة",
    youth:"الشباب",
    homeland:"الوطن",
    wisdom:"الحكمة",
    humor:"الضحك وخفة الدم"
  };

  return labels[category] || category || "شعر وأدب";
}

function showError(title,message){
  card.innerHTML = `
    <div class="error-state">
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(message)}</p>
      <a class="error-link" href="poetry.html">
        العودة إلى مكتبة الشعر
      </a>
    </div>
  `;
}

function getAllPoems(){
  if(!API || typeof API.getAllPoems !== "function"){
    return [];
  }

  const result = API.getAllPoems();
  return Array.isArray(result) ? result : [];
}


/* ===============================
   العثور على الديوان والقصيدة
=============================== */

function findCollection(target){
  if(!target || !API || typeof API.getAllCollections !== "function"){
    return null;
  }

  const collections = API.getAllCollections();

  if(!Array.isArray(collections)){
    return null;
  }

  return collections.find(function(item){
    return Array.isArray(item.poems) &&
      item.poems.some(function(entry){
        return entry.id === target.id;
      });
  }) || null;
}

function findPoem(){
  if(!API){
    return null;
  }

  if(requestedId && typeof API.getPoemById === "function"){
    return API.getPoemById(requestedId);
  }

  if(
    requestedCollection &&
    typeof API.getPoemsByCollection === "function"
  ){
    const items = API.getPoemsByCollection(requestedCollection);

    if(Array.isArray(items) && items.length){
      return items[0];
    }
  }

  return null;
}


/* ===============================
   المفضلة
=============================== */

function isFavorite(){
  return !!(
    API &&
    poem &&
    typeof API.isFavorite === "function" &&
    API.isFavorite(poem.id)
  );
}

function updateFavoriteButton(){
  const button = document.getElementById("favoriteButton");

  if(!button){
    return;
  }

  const saved = isFavorite();

  button.classList.toggle("active",saved);
  button.textContent = saved
    ? "♥ في المفضلة"
    : "♡ أضف للمفضلة";
}

function toggleFavorite(){
  if(!API || !poem){
    return;
  }

  if(typeof API.toggleFavorite === "function"){
    API.toggleFavorite(poem.id);

  }else if(
    typeof API.addFavorite === "function" &&
    typeof API.removeFavorite === "function"
  ){
    if(isFavorite()){
      API.removeFavorite(poem.id);
    }else{
      API.addFavorite(poem.id);
    }

  }else{
    showToast("خدمة المفضلة غير متاحة في ملف البيانات.");
    return;
  }

  updateFavoriteButton();

  showToast(
    isFavorite()
      ? "اتضافت القصيدة للمفضلة"
      : "اتشالت القصيدة من المفضلة"
  );
}


/* ===============================
   المشاركة
=============================== */

async function sharePoem(){
  if(!poem){
    return;
  }

  const poemText = [
    poem.title,
    "",
    ...(Array.isArray(poem.lines) ? poem.lines : []),
    "",
    "Yousef Elgorf",
    "",
    window.location.href
  ].join("\n");

  try{
    if(navigator.share){
      await navigator.share({
        title:poem.title,
        text:poemText,
        url:window.location.href
      });

      return;
    }

    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(poemText);
      showToast("تم نسخ القصيدة والرابط.");
      return;
    }

    const temporary = document.createElement("textarea");

    temporary.value = poemText;
    temporary.style.position = "fixed";
    temporary.style.opacity = "0";

    document.body.appendChild(temporary);
    temporary.select();

    const copied = document.execCommand("copy");
    temporary.remove();

    showToast(
      copied
        ? "تم نسخ القصيدة والرابط."
        : "تعذر النسخ من هذا المتصفح."
    );

  }catch(error){
    if(error && error.name !== "AbortError"){
      showToast("تعذرت مشاركة القصيدة.");
    }
  }
}


/* ===============================
   حجم الخط
=============================== */

function changeFont(amount){
  fontSize = Math.min(32,Math.max(14,fontSize + amount));

  document.documentElement.style.setProperty(
    "--poem-size",
    fontSize + "px"
  );
}


/* ===============================
   وضع القراءة
=============================== */

function toggleTheme(){
  document.body.classList.toggle("light-mode");

  const button = document.getElementById("themeButton");

  if(!button){
    return;
  }

  const light = document.body.classList.contains("light-mode");

  button.classList.toggle("active",light);

  button.textContent = light
    ? "الوضع الداكن"
    : "الوضع الفاتح";
}


/* ===============================
   القراءة الصوتية
=============================== */

function updateAudioUI(){
  const status = document.getElementById("audioStatus");
  const playButton = document.getElementById("audioPlay");
  const pauseButton = document.getElementById("audioPause");
  const progress = document.getElementById("audioProgress");

  if(!status || !playButton || !pauseButton){
    return;
  }

  const total = speechLines.length || 1;

  let percentage = Math.round((speechIndex / total) * 100);

  if(speechState === "ended"){
    percentage = 100;
  }

  if(speechState === "playing"){
    status.textContent = "جاري قراءة القصيدة";
    playButton.textContent = "إعادة القراءة";
    pauseButton.disabled = false;

  }else if(speechState === "paused"){
    status.textContent = "القراءة متوقفة مؤقتًا";
    playButton.textContent = "استكمال القراءة";
    pauseButton.disabled = true;

  }else if(speechState === "ended"){
    status.textContent = "انتهت القراءة";
    playButton.textContent = "استمع مرة أخرى";
    pauseButton.disabled = true;

  }else{
    status.textContent = canSpeak
      ? "جاهز للاستماع"
      : "القراءة الصوتية غير مدعومة";

    playButton.textContent = "استمع للقصيدة";
    pauseButton.disabled = true;
  }

  if(progress){
    progress.style.width = percentage + "%";
  }

  playButton.disabled = !canSpeak;
}

function highlightLine(index){
  const lines = document.querySelectorAll(".poem-line");

  lines.forEach(function(line,i){
    line.classList.toggle("current-line",i === index);
  });

  if(index >= 0 && lines[index]){
    lines[index].scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}

function stopSpeech(){
  if(canSpeak){
    window.speechSynthesis.cancel();
  }

  speechState = "idle";
  speechIndex = 0;

  updateAudioUI();
  highlightLine(-1);
}

function speakNextLine(){
  if(!canSpeak || speechState !== "playing"){
    return;
  }

  if(speechIndex >= speechLines.length){
    speechState = "ended";

    updateAudioUI();
    highlightLine(-1);

    return;
  }

  const utterance = new SpeechSynthesisUtterance(
    speechLines[speechIndex]
  );

  utterance.lang = "ar-EG";
  utterance.rate = .88;
  utterance.pitch = 1;
  utterance.volume = 1;

  highlightLine(speechIndex);
  updateAudioUI();

  utterance.onend = function(){
    if(speechState !== "playing"){
      return;
    }

    speechIndex++;
    speakNextLine();
  };

  utterance.onerror = function(event){
    if(
      event.error === "interrupted" ||
      event.error === "canceled"
    ){
      return;
    }

    speechState = "idle";
    updateAudioUI();

    showToast("حصلت مشكلة أثناء تشغيل الصوت.");
  };

  window.speechSynthesis.speak(utterance);
}

function playSpeech(){
  if(!canSpeak){
    showToast("المتصفح لا يدعم القراءة الصوتية.");
    return;
  }

  if(speechState === "paused"){
    speechState = "playing";
    window.speechSynthesis.resume();
    updateAudioUI();
    return;
  }

  if(speechState === "playing"){
    stopSpeech();
    return;
  }

  if(speechState === "ended"){
    speechIndex = 0;
  }

  speechLines = (
    Array.isArray(poem.lines) ? poem.lines : []
  ).map(function(line){
    return String(line).trim();
  }).filter(Boolean);

  if(!speechLines.length){
    showToast("لا توجد أسطر متاحة للقراءة.");
    return;
  }

  window.speechSynthesis.cancel();

  speechState = "playing";
  speechIndex = 0;

  speakNextLine();
}

function pauseSpeech(){
  if(!canSpeak || speechState !== "playing"){
    return;
  }

  window.speechSynthesis.pause();

  speechState = "paused";
  updateAudioUI();
}


/* ===============================
   التنقل بين القصائد
=============================== */

function navigatePoem(direction){
  if(poemIndex < 0 || !poems.length){
    return;
  }

  const nextIndex = poemIndex + direction;

  if(nextIndex < 0 || nextIndex >= poems.length){
    return;
  }

  const nextPoem = poems[nextIndex];

  if(!nextPoem || !nextPoem.id){
    return;
  }

  stopSpeech();

  window.location.href =
    "poem.html?id=" + encodeURIComponent(nextPoem.id);
}


/* ===============================
   بناء صفحة القصيدة
=============================== */

function renderPoem(){
  if(!poem){
    showError(
      "القصيدة مش موجودة",
      "الرابط غير صحيح أو القصيدة غير مسجلة في مكتبة الشعر."
    );

    return;
  }

  collection = findCollection(poem);

  poems = collection && Array.isArray(collection.poems)
    ? collection.poems
    : getAllPoems();

  poemIndex = poems.findIndex(function(item){
    return item.id === poem.id;
  });

  const lines = Array.isArray(poem.lines)
    ? poem.lines
    : [];

  const lineMarkup = lines.length
    ? lines.map(function(line,index){
        return `
          <div class="poem-line" data-line="${index}">
            <span class="poem-line-number">${number(index + 1)}</span>
            ${escapeHTML(line)}
          </div>
        `;
      }).join("")
    : `
      <div class="error-state">
        لا توجد أبيات مسجلة في هذه القصيدة.
      </div>
    `;

  const collectionTitle = collection
    ? collection.title
    : "مكتبة الشعر";

  const collectionLink = collection
    ? "poem-collection.html?id=" + encodeURIComponent(collection.id)
    : "poetry.html";

  backToCollection.href = collectionLink;

  document.title = poem.title + " | HANOON";

  document.getElementById("breadcrumbCollection").textContent =
    collectionTitle;

  card.innerHTML = `

    <header class="poem-header">

      <span class="poem-category">
        ${escapeHTML(categoryLabel(
          poem.category || (collection && collection.category)
        ))}
      </span>

      <h1 class="poem-title">
        ${escapeHTML(poem.title)}
      </h1>

      <p class="poem-description">
        ${escapeHTML(
          poem.description ||
          "قصيدة من مكتبة هنون للشعر والأدب."
        )}
      </p>

      <div class="author-row">

        <img
          class="author-avatar"
          src="../assets/avatars/yousef.jpg"
          alt="Yousef Elgorf"
          onerror="this.style.display='none'"
        >

        <div>
          <div class="author-name">
            ${escapeHTML(
              collection && collection.author
                ? collection.author
                : "Yousef Elgorf"
            )}
          </div>

          <div class="author-caption">
            كاتب وشاعر
          </div>
        </div>

      </div>

      <div class="meta-row">

        ${
          collection
            ? `
              <span class="meta-chip">
                الديوان: ${escapeHTML(collection.title)}
              </span>
            `
            : ""
        }

        ${
          poem.rhyme
            ? `
              <span class="meta-chip">
                القافية: ${escapeHTML(poem.rhyme)}
              </span>
            `
            : ""
        }

        ${
          poem.rhythm
            ? `
              <span class="meta-chip">
                الإيقاع: ${escapeHTML(poem.rhythm)}
              </span>
            `
            : ""
        }

        <span class="meta-chip">
          ${number(lines.length)} سطر
        </span>

      </div>

    </header>

    <div class="tools-bar">

      <button
        class="tool-btn favorite"
        id="favoriteButton"
        type="button"
      >
        ♡ أضف للمفضلة
      </button>

      <button
        class="tool-btn"
        id="shareButton"
        type="button"
      >
        مشاركة
      </button>

      <div class="font-control">
        <span>حجم الخط</span>

        <button
          id="fontDown"
          type="button"
          aria-label="تصغير الخط"
        >−</button>

        <button
          id="fontUp"
          type="button"
          aria-label="تكبير الخط"
        >+</button>
      </div>

      <button
        class="tool-btn"
        id="themeButton"
        type="button"
      >
        الوضع الفاتح
      </button>

    </div>

    <section class="audio-panel">

      <div class="audio-top">
        <span class="audio-title">
          الاستماع للقصيدة
        </span>

        <span class="audio-status" id="audioStatus">
          جاهز للاستماع
        </span>
      </div>

      <div class="audio-controls">

        <button
          class="audio-btn main"
          id="audioPlay"
          type="button"
        >
          استمع للقصيدة
        </button>

        <button
          class="audio-btn"
          id="audioPause"
          type="button"
          disabled
        >
          إيقاف مؤقت
        </button>

        <button
          class="audio-btn"
          id="audioStop"
          type="button"
        >
          إيقاف
        </button>

      </div>

      <div class="audio-progress">
        <div
          class="audio-progress-fill"
          id="audioProgress"
        ></div>
      </div>

    </section>

    <article class="poem-content">

      <div class="poem-decoration">
        ✦
      </div>

      <div class="poem-lines">
        ${lineMarkup}
      </div>

      <div class="poem-end">
        ✦ ✧ ✦
      </div>

    </article>

    <nav
      class="poem-navigation"
      aria-label="التنقل بين القصائد"
    >

      <button
        class="nav-poem"
        id="previousPoem"
        type="button"
      >
        ← القصيدة السابقة
      </button>

      <span class="nav-counter">
        ${
          poemIndex >= 0
            ? number(poemIndex + 1) + " / " + number(poems.length)
            : ""
        }
      </span>

      <button
        class="nav-poem"
        id="nextPoem"
        type="button"
      >
        القصيدة التالية →
      </button>

    </nav>

  `;

  bindEvents();

  updateFavoriteButton();
  updateAudioUI();

  document.getElementById("previousPoem").disabled =
    poemIndex <= 0;

  document.getElementById("nextPoem").disabled =
    poemIndex < 0 || poemIndex >= poems.length - 1;
}


/* ===============================
   ربط الأزرار
=============================== */

function bindEvents(){

  document.getElementById("favoriteButton")
    .addEventListener("click",toggleFavorite);

  document.getElementById("shareButton")
    .addEventListener("click",sharePoem);

  document.getElementById("fontDown")
    .addEventListener("click",function(){
      changeFont(-1);
    });

  document.getElementById("fontUp")
    .addEventListener("click",function(){
      changeFont(1);
    });

  document.getElementById("themeButton")
    .addEventListener("click",toggleTheme);

  document.getElementById("audioPlay")
    .addEventListener("click",playSpeech);

  document.getElementById("audioPause")
    .addEventListener("click",pauseSpeech);

  document.getElementById("audioStop")
    .addEventListener("click",stopSpeech);

  document.getElementById("previousPoem")
    .addEventListener("click",function(){
      navigatePoem(-1);
    });

  document.getElementById("nextPoem")
    .addEventListener("click",function(){
      navigatePoem(1);
    });
}


/* ===============================
   تشغيل الصفحة
=============================== */

function initialize(){

  if(!API){
    showError(
      "تعذر تحميل مكتبة الشعر",
      "تأكد من وجود ملفات الدواوين وملف poetry.js المركزي في المسارات الصحيحة."
    );

    return;
  }

  poem = findPoem();

  if(!poem){
    showError(
      "لم يتم العثور على القصيدة",
      "ارجع إلى مكتبة الشعر وافتح القصيدة من داخل الديوان."
    );

    return;
  }

  renderPoem();
}

window.addEventListener("beforeunload",function(){
  if(canSpeak){
    window.speechSynthesis.cancel();
  }
});

initialize();

window.addEventListener("hanoon:poetry-ready",function(){
  if(!poem){
    initialize();
  }
});

})();
</script>
