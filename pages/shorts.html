
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>الفيديوهات | HANOON</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#fe2c55;
  --white:#fff;
  --muted:#bcbcbc;
  --black:#080808;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  min-height:0;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  background:#000;
}
body{
  color:var(--white);
  font-family:Cairo,sans-serif;
}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* شاشة الفيديو */
.page{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
}
.shorts-feed{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
  background:#000;
}
.shorts-feed::-webkit-scrollbar{display:none}

/* كل فيديو */
.video-card{
  position:relative;
  isolation:isolate;
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  background:#080808;
}
.video-card video{
  position:absolute;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#080808;
}
.video-shade{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.43) 0%,
      transparent 18%,
      transparent 48%,
      rgba(0,0,0,.18) 65%,
      rgba(0,0,0,.82) 100%
    );
}

/* رأس الصفحة */
.topbar{
  position:fixed;
  z-index:30;
  top:0;
  right:0;
  left:0;
  height:calc(62px + env(safe-area-inset-top));
  padding:
    env(safe-area-inset-top)
    14px
    0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(#0009,transparent);
  pointer-events:none;
}
.topbar>*{pointer-events:auto}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:16px;
  font-weight:900;
  text-shadow:0 2px 10px #000;
}
.brand-mark{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid #ffffff55;
  border-radius:11px;
  background:#ffffff1c;
  backdrop-filter:blur(12px);
}
.brand-mark svg{
  width:19px;
  fill:none;
  stroke:white;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.brand-name span{color:var(--pink)}
.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.header-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid #ffffff35;
  border-radius:50%;
  background:#0005;
  color:white;
  backdrop-filter:blur(12px);
}
.header-icon svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.upload-btn{
  min-height:37px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:0 12px;
  border:0;
  border-radius:7px;
  background:white;
  color:#111;
  font-size:11px;
  font-weight:900;
}
.upload-btn svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.upload-btn:disabled{opacity:.5}
#shortFileInput{display:none}

/* تبويبات لك ومتابَعون */
.feed-tabs{
  position:fixed;
  z-index:25;
  top:calc(67px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  width:max-content;
  max-width:90%;
}
.feed-tab{
  position:relative;
  padding:7px 2px 10px;
  border:0;
  background:none;
  color:#ddd;
  font-size:13px;
  font-weight:800;
  text-shadow:0 2px 8px #000;
}
.feed-tab.active{color:white}
.feed-tab.active:after{
  content:"";
  position:absolute;
  bottom:3px;
  right:15%;
  width:70%;
  height:3px;
  border-radius:5px;
  background:white;
}

/* بيانات صاحب الفيديو */
.video-info{
  position:absolute;
  z-index:4;
  right:14px;
  left:78px;
  bottom:calc(88px + env(safe-area-inset-bottom));
  pointer-events:auto;
}
.creator{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:9px;
}
.avatar{
  width:43px;
  height:43px;
  flex:0 0 43px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:2px solid white;
  border-radius:50%;
  background:linear-gradient(135deg,#555,#222);
  color:white;
  font-size:14px;
  font-weight:900;
  box-shadow:0 2px 12px #0008;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.creator-name{
  color:white;
  font-size:13px;
  font-weight:900;
  text-shadow:0 2px 8px #000;
}
.caption{
  max-width:100%;
  margin:0;
  color:white;
  font-size:12px;
  line-height:1.9;
  overflow-wrap:anywhere;
  text-shadow:0 2px 8px #000;
}

/* أزرار التفاعل */
.video-actions{
  position:absolute;
  z-index:5;
  left:10px;
  bottom:calc(96px + env(safe-area-inset-bottom));
  display:grid;
  justify-items:center;
  gap:16px;
}
.action-wrap{
  display:grid;
  justify-items:center;
  gap:4px;
  color:white;
}
.action{
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  color:white;
  filter:drop-shadow(0 2px 5px #0008);
}
.action svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.action.liked{color:var(--pink)}
.action-wrap small{
  min-height:13px;
  color:white;
  font-size:10px;
  font-weight:900;
  text-shadow:0 2px 7px #000;
}

/* إشعارات */
.notice{
  position:fixed;
  z-index:100;
  top:calc(110px + env(safe-area-inset-top));
  right:12px;
  left:12px;
  display:none;
  max-width:440px;
  margin:auto;
  padding:12px 15px;
  border:1px solid #ffffff38;
  border-radius:12px;
  background:#171717f5;
  color:white;
  box-shadow:0 12px 35px #0008;
  font-size:11px;
  line-height:1.8;
}

/* الشريط السفلي */
.bottom-nav{
  position:fixed;
  z-index:35;
  right:0;
  bottom:0;
  left:0;
  height:calc(62px + env(safe-area-inset-bottom));
  padding:6px 10px env(safe-area-inset-bottom);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  border-top:1px solid #ffffff18;
  background:linear-gradient(transparent,#000 25%);
}
.nav-item{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border:0;
  background:none;
  color:#d5d5d5;
  font-size:9px;
  font-weight:700;
}
.nav-item svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.nav-item.active{color:white}
.nav-item.active svg{stroke-width:2.5}
.create-nav{
  width:43px;
  height:29px;
  display:grid;
  place-items:center;
  border:0;
  border-right:4px solid #55e4dc;
  border-left:4px solid var(--pink);
  border-radius:8px;
  background:white;
  color:#111;
}
.create-nav svg{
  width:20px;
  height:20px;
  stroke:#111;
  stroke-width:2.5;
}

/* شاشة عدم وجود فيديوهات */
.empty{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:13px;
  padding:30px;
  color:white;
  text-align:center;
  font-size:12px;
  line-height:2;
}
.empty:before{
  content:"";
  width:65px;
  height:65px;
  display:block;
  border:1px solid #ffffff55;
  border-radius:20px;
  background:linear-gradient(135deg,#fe2c55,#6c50df);
}
.empty strong{font-size:15px}
.empty small{color:#bbb;font-size:11px}

/* شريط تقدم الفيديو */
.video-progress{
  position:absolute;
  z-index:6;
  right:0;
  bottom:calc(62px + env(safe-area-inset-bottom));
  left:0;
  height:2px;
  background:#ffffff35;
}
.video-progress span{
  display:block;
  width:0;
  height:100%;
  background:white;
}

/* شاشة الكمبيوتر */
@media(min-width:700px){
  body{background:#151515}
  .page{
    width:min(480px,100%);
    right:50%;
    left:auto;
    transform:translateX(50%);
    border-right:1px solid #333;
    border-left:1px solid #333;
  }
  .topbar{
    right:50%;
    left:auto;
    width:min(480px,100%);
    transform:translateX(50%);
  }
  .bottom-nav{
    right:50%;
    left:auto;
    width:min(480px,100%);
    transform:translateX(50%);
  }
}

/* الشاشات الصغيرة */
@media(max-width:380px){
  .brand{font-size:14px}
  .upload-btn{padding:0 9px;font-size:10px}
  .video-info{right:10px;left:70px}
  .video-actions{left:5px;gap:12px}
  .action{width:41px;height:41px}
}

/* تقليل الحركة عند طلب الجهاز */
@media(prefers-reduced-motion:reduce){
  .shorts-feed{scroll-behavior:auto}
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="18" rx="3"/>
        <path d="m10 8 5 4-5 4z"/>
      </svg>
    </span>
    <span class="brand-name">HANOON<span>.</span></span>
  </a>

  <div class="header-actions">
    <button class="header-icon" type="button" aria-label="بحث" onclick="location.href='search.html'">
      <svg viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8"/>
        <path d="m16 16 5 5"/>
      </svg>
    </button>

    <button class="upload-btn" id="uploadShortBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M12 16V4m-5 5 5-5 5 5"/>
        <path d="M4 16v4h16v-4"/>
      </svg>
      إضافة فيديو
    </button>

    <input id="shortFileInput" type="file" accept="video/mp4,video/webm" hidden>
  </div>
</header>

<nav class="feed-tabs" aria-label="أنواع الفيديوهات">
  <button class="feed-tab active" type="button" data-feed="for-you">لك</button>
  <button class="feed-tab" type="button" data-feed="following">المتابَعون</button>
</nav>

<div id="shortNotice" class="notice" role="status" aria-live="polite"></div>

<main class="page">
  <section id="shortsFeed" class="shorts-feed" aria-label="الفيديوهات القصيرة">
    <div class="empty">
      <strong>عالم فيديوهات هنون</strong>
      جارٍ تجهيز الفيديوهات...
      <small>اسحب لأعلى لاكتشاف المزيد</small>
    </div>
  </section>
</main>

<nav class="bottom-nav" aria-label="التنقل الرئيسي">
  <a class="nav-item" href="../index.html">
    <svg viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>
    </svg>
    <span>الرئيسية</span>
  </a>

  <a class="nav-item" href="community.html">
    <svg viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3"/>
      <circle cx="17" cy="9" r="2.5"/>
      <path d="M3 20v-1a6 6 0 0 1 12 0v1zM16 15a5 5 0 0 1 5 5"/>
    </svg>
    <span>اكتشف</span>
  </a>

  <button class="nav-item" type="button" id="bottomUploadBtn" aria-label="إضافة فيديو">
    <span class="create-nav">
      <svg viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </span>
    <span>إضافة</span>
  </button>

  <a class="nav-item" href="messages.html">
    <svg viewBox="0 0 24 24">
      <path d="M4 5h16v12H9l-5 4z"/>
      <path d="M8 9h8M8 13h5"/>
    </svg>
    <span>الرسائل</span>
  </a>

  <a class="nav-item" href="profile.html">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
    </svg>
    <span>الملف الشخصي</span>
  </a>
</nav>

<script>
document.getElementById("bottomUploadBtn").addEventListener("click",function(){
  document.getElementById("shortFileInput").click();
});
</script>

<script type="module" src="../js/shorts.js"></script>

</body>
</html>
