
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d20">
  <title>الفيديوهات القصيرة | هنون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    :root{
      --cyan:#54e5e2;
      --blue:#4389ff;
      --purple:#9875ff;
      --text:#f5f7ff;
      --muted:#a9b5d0;
    }
    body{
      margin:0;
      min-height:100vh;
      font-family:Cairo,sans-serif;
      color:var(--text);
      background:
        radial-gradient(ellipse at 15% 10%,rgba(35,116,220,.25),transparent 38%),
        radial-gradient(ellipse at 90% 75%,rgba(105,65,210,.22),transparent 38%),
        linear-gradient(145deg,#080d20,#101b38 55%,#0b1025);
      background-attachment:fixed;
    }
    button{font:inherit;cursor:pointer}
    .topbar{
      width:min(100% - 24px,850px);
      margin:14px auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 15px;
      border:1px solid rgba(130,180,255,.18);
      border-radius:17px;
      background:rgba(13,24,52,.78);
      backdrop-filter:blur(18px);
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand-icon{
      width:39px;height:39px;
      display:grid;place-items:center;
      border-radius:13px;
      color:white;
      background:linear-gradient(140deg,#347ee9,#8d65ee);
      box-shadow:0 5px 20px #397de94d;
    }
    .brand-icon svg{width:21px;stroke:currentColor;fill:none;stroke-width:1.8}
    .brand strong{display:block;font-size:15px;font-weight:900}
    .brand small{display:block;color:var(--muted);font-size:10px}
    .back-link{
      color:#eaf4ff;text-decoration:none;
      border:1px solid rgba(130,180,255,.2);
      background:rgba(255,255,255,.06);
      padding:8px 13px;border-radius:11px;
      font-size:12px;font-weight:800;
    }
    .page-title{
      width:min(100% - 24px,850px);
      margin:20px auto 14px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .page-title h1{margin:0;font-size:21px;font-weight:900}
    .page-title p{margin:3px 0 0;color:var(--muted);font-size:11px}
    .upload-btn{
      display:flex;align-items:center;gap:7px;
      border:0;border-radius:12px;
      padding:10px 14px;color:white;
      background:linear-gradient(120deg,#347fe9,#8865ed);
      box-shadow:0 8px 23px #477ce944;
      font-size:12px;font-weight:900;
      white-space:nowrap;
    }
    .upload-btn:disabled{opacity:.55;cursor:not-allowed}
    .upload-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
    .notice{
      display:none;
      width:min(100% - 24px,850px);
      margin:0 auto 12px;
      padding:11px 14px;
      border:1px solid rgba(152,117,255,.5);
      border-radius:12px;
      background:rgba(20,27,55,.9);
      font-size:12px;line-height:1.8;
    }
    .shorts-feed{
      width:min(100% - 24px,520px);
      margin:0 auto 40px;
      display:grid;gap:18px;
    }
    .video-card{
      position:relative;
      width:100%;
      height:min(72vh,690px);
      min-height:430px;
      overflow:hidden;
      border-radius:23px;
      background:#050914;
      border:1px solid rgba(133,177,255,.2);
      box-shadow:0 18px 55px rgba(0,0,0,.35);
      isolation:isolate;
    }
    .video-card video{
      position:absolute;inset:0;
      width:100%;height:100%;
      object-fit:contain;
      background:#050914;
    }
    .video-shade{
      position:absolute;inset:0;z-index:1;
      pointer-events:none;
      background:linear-gradient(0deg,rgba(3,8,20,.9),transparent 42%,rgba(3,8,20,.12));
    }
    .video-info{
      position:absolute;z-index:2;
      right:16px;left:75px;bottom:20px;
      pointer-events:none;
    }
    .creator{display:flex;align-items:center;gap:9px;margin-bottom:10px}
    .avatar{
      width:38px;height:38px;flex:0 0 38px;
      display:grid;place-items:center;overflow:hidden;
      border-radius:50%;background:linear-gradient(135deg,#3489ec,#9365ed);
      border:2px solid rgba(255,255,255,.7);
      font-weight:900;
    }
    .creator-name{font-size:13px;font-weight:900}
    .caption{margin:0;font-size:12px;line-height:1.8;overflow-wrap:anywhere}
    .video-actions{
      position:absolute;z-index:3;
      left:12px;bottom:24px;
      display:grid;gap:15px;
    }
    .action-wrap{
      display:grid;justify-items:center;gap:3px;
      color:white;
    }
    .action{
      width:43px;height:43px;
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.2);
      border-radius:50%;
      color:white;background:rgba(8,15,34,.65);
      backdrop-filter:blur(10px);
    }
    .action svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .action.liked{color:#ff6c9b;background:rgba(255,70,130,.17)}
    .action small{font-size:10px;font-weight:800}
    .empty{
      padding:45px 18px;text-align:center;
      border:1px dashed rgba(140,177,255,.28);
      border-radius:19px;
      background:rgba(15,25,53,.65);
      color:#c1cce2;font-size:13px;line-height:2;
    }
    .auth-link{
      display:inline-block;margin-top:13px;
      color:#9bdfff;font-weight:800;text-decoration:none;
    }
    @media(max-width:600px){
      .topbar{margin:9px auto;padding:10px 12px}
      .page-title{margin-top:15px}
      .page-title h1{font-size:18px}
      .upload-btn{padding:9px 10px;font-size:11px}
      .shorts-feed{width:100%;gap:12px}
      .video-card{
        width:100%;height:calc(100dvh - 155px);
        min-height:440px;max-height:760px;
        border-radius:17px;
      }
      .video-info{right:13px;bottom:17px}
      .video-actions{left:9px;bottom:20px;gap:12px}
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="3" width="16" height="18" rx="3"/>
          <path d="m10 8 5 4-5 4z"/>
        </svg>
      </div>
      <div>
        <strong>HANOON</strong>
        <small>الفيديوهات القصيرة</small>
      </div>
    </div>
    <a class="back-link" href="../index.html">العودة للرئيسية</a>
  </header>

  <section class="page-title">
    <div>
      <h1>الفيديوهات القصيرة</h1>
      <p>شاهد وشارك لحظات المعرفة والإبداع</p>
    </div>
    <button class="upload-btn" id="uploadShortBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M12 16V4m-5 5 5-5 5 5"/>
        <path d="M4 16v4h16v-4"/>
      </svg>
      إضافة فيديو
    </button>
    <input id="shortFileInput" type="file" accept="video/mp4,video/webm" hidden>
  </section>

  <div id="shortNotice" class="notice" role="status" aria-live="polite"></div>

  <main id="shortsFeed" class="shorts-feed">
    <div class="empty">جارٍ تجهيز الفيديوهات...</div>
  </main>

  <script type="module" src="../js/shorts.js"></script>
</body>
</html>
