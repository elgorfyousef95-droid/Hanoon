
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>فيديوهات هنون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --cyan:#55e4dc;
  --purple:#9274ff;
  --text:#fff;
  --muted:#c1c6d8;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  min-height:0;
  margin:0;
  overflow:hidden!important;
  overscroll-behavior:none;
}
body{
  font-family:Cairo,sans-serif;
  color:var(--text);
  background:#080b16;
}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.topbar{
  position:relative;
  z-index:10;
  height:58px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 15px;
  background:linear-gradient(90deg,#10152c,#171b38);
  border-bottom:1px solid #ffffff15;
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
}
.brand-icon{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,#347fe9,#9365ed);
  box-shadow:0 5px 18px #765eea55;
}
.brand-icon svg{
  width:19px;
  fill:none;
  stroke:white;
  stroke-width:1.8;
}
.brand strong{
  display:block;
  font-size:13px;
  font-weight:900;
}
.brand small{
  display:block;
  color:#aeb8d5;
  font-size:9px;
}
.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.back-link,.upload-btn{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:6px 11px;
  border:1px solid #ffffff20;
  border-radius:11px;
  background:#ffffff0c;
  color:white;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}
.upload-btn{
  border:0;
  background:linear-gradient(120deg,#347fe9,#8865ed);
  box-shadow:0 5px 18px #477ce944;
}
.upload-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}
.upload-btn svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}
#shortFileInput{display:none}

.notice{
  position:fixed;
  z-index:30;
  top:67px;
  right:12px;
  left:12px;
  display:none;
  max-width:520px;
  margin:auto;
  padding:11px 14px;
  border:1px solid #9274ff88;
  border-radius:13px;
  background:#171a35f5;
  color:#fff;
  box-shadow:0 10px 30px #0008;
  font-size:11px;
  line-height:1.8;
}

.page{
  position:relative;
  width:100%;
  height:calc(100dvh - 58px);
  overflow:hidden;
  background:#080b16;
}
.shorts-feed{
  width:100%;
  height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
  background:#080b16;
}
.shorts-feed::-webkit-scrollbar{display:none}

.video-card{
  position:relative;
  isolation:isolate;
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  background:#050711;
  border:0;
  border-radius:0;
  box-shadow:none;
}
.video-card video{
  position:absolute;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#050711;
}
.video-card video::-webkit-media-controls-panel{
  background:linear-gradient(transparent,#0008);
}
.video-shade{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(0deg,#050711ed 0%,#05071155 22%,transparent 48%,#05071144 100%);
}
.video-info{
  position:absolute;
  z-index:3;
  right:17px;
  left:83px;
  bottom:calc(22px + env(safe-area-inset-bottom));
  pointer-events:auto;
}
.creator{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:2px solid #fff;
  border-radius:50%;
  background:linear-gradient(135deg,#347fe9,#9365ed);
  color:white;
  font-size:15px;
  font-weight:900;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.creator-name{
  color:#fff;
  font-size:12px;
  font-weight:900;
  text-shadow:0 2px 8px #000;
}
.caption{
  margin:0;
  color:#fff;
  font-size:12px;
  line-height:1.9;
  overflow-wrap:anywhere;
  text-shadow:0 2px 8px #000;
}
.video-actions{
  position:absolute;
  z-index:4;
  left:12px;
  bottom:calc(28px + env(safe-area-inset-bottom));
  display:grid;
  justify-items:center;
  gap:16px;
}
.action-wrap{
  display:grid;
  justify-items:center;
  gap:4px;
  color:white;
}
.action{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border:1px solid #ffffff45;
  border-radius:50%;
  background:#11172c99;
  color:#fff;
  backdrop-filter:blur(12px);
  box-shadow:0 5px 16px #0005;
}
.action svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.action.liked{
  color:#ff5d9c;
  background:#ff47802c;
  border-color:#ff7fa4;
}
.action-wrap small{
  color:white;
  font-size:9px;
  font-weight:900;
  text-shadow:0 2px 6px #000;
}
.empty{
  width:min(90%,430px);
  min-height:230px;
  margin:35px auto;
  padding:35px 20px;
  display:grid;
  place-items:center;
  align-content:center;
  gap:10px;
  border:1px solid #9274ff45;
  border-radius:22px;
  background:linear-gradient(145deg,#171d3a,#10152a);
  color:#d8def5;
  text-align:center;
  font-size:12px;
  line-height:2;
}
.empty::before{
  content:"";
  width:55px;
  height:55px;
  display:block;
  border:1px solid #9c8aff88;
  border-radius:18px;
  background:linear-gradient(135deg,#347fe9,#9365ed);
  box-shadow:0 8px 25px #6f64d944;
}
@media(min-width:701px){
  .page{
    width:min(520px,100%);
    height:calc(100dvh - 58px);
    margin:auto;
    border-left:1px solid #ffffff15;
    border-right:1px solid #ffffff15;
  }
  body{background:#080b16}
}
@media(max-width:600px){
  .topbar{
    height:53px;
    padding:0 10px;
  }
  .page{
    height:calc(100dvh - 53px);
  }
  .back-link{
    padding:6px 8px;
    font-size:9px;
  }
  .upload-btn{
    padding:6px 9px;
    font-size:9px;
  }
  .video-info{
    right:12px;
    left:76px;
    bottom:calc(18px + env(safe-area-inset-bottom));
  }
  .video-actions{
    left:8px;
    bottom:calc(23px + env(safe-area-inset-bottom));
    gap:13px;
  }
  .action{
    width:41px;
    height:41px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="18" rx="3"/>
        <path d="m10 8 5 4-5 4z"/>
      </svg>
    </span>
    <span>
      <strong>HANOON</strong>
      <small>الفيديوهات القصيرة</small>
    </span>
  </a>

  <div class="header-actions">
    <button class="upload-btn" id="uploadShortBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M12 16V4m-5 5 5-5 5 5"/>
        <path d="M4 16v4h16v-4"/>
      </svg>
      إضافة فيديو
    </button>
    <input id="shortFileInput" type="file" accept="video/mp4,video/webm" hidden>
    <a class="back-link" href="../index.html">الرئيسية</a>
  </div>
</header>

<div id="shortNotice" class="notice" role="status" aria-live="polite"></div>

<main class="page">
  <section id="shortsFeed" class="shorts-feed">
    <div class="empty">جارٍ تجهيز الفيديوهات...</div>
  </section>
</main>

<script type="module" src="../js/shorts.js"></script>

</body>
</html>
