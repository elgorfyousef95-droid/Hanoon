
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>المحادثة | هنون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --page:#0b141a;
  --header:#202c33;
  --panel:#1f2c34;
  --panel2:#263640;
  --line:#ffffff12;
  --text:#e9edef;
  --muted:#aebac0;
  --green:#00a884;
  --green-dark:#075e54;
  --mine:#005c4b;
  --other:#202c33;
  --blue:#53bdeb;
  --danger:#f05d73;
  --shadow:0 12px 35px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  height:100dvh;
  margin:0;
  overflow:hidden;
  font-family:Cairo,sans-serif;
  background:var(--page);
  color:var(--text);
}

button,input,textarea{font:inherit}
button{border:0;cursor:pointer;color:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}

.chat-shell{
  width:100%;
  height:100%;
  height:100dvh;
  max-width:1000px;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  isolation:isolate;
  background:var(--page);
}

/* HEADER */

.chat-header{
  min-height:62px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  background:var(--header);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
  z-index:5;
}

.back-button,
.header-action{
  width:39px;
  height:39px;
  flex-shrink:0;
  border-radius:50%;
  background:transparent;
  display:grid;
  place-items:center;
  color:#e9edef;
  transition:background .2s,transform .2s;
}

.back-button:active,
.header-action:active{
  background:rgba(255,255,255,.12);
  transform:scale(.94);
}

.back-button svg,
.header-action svg,
.tool-button svg,
.send-button svg,
.record-button svg,
.menu-item svg,
.close-panel svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.person-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  flex-shrink:0;
  background:linear-gradient(135deg,#128c7e,#075e54);
  display:grid;
  place-items:center;
  overflow:hidden;
  font-weight:800;
  font-size:16px;
  border:0;
}

.person-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.person-info{
  min-width:0;
  flex:1;
}

.person-name{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#e9edef;
}

.person-status{
  font-size:10px;
  color:#aebac0;
  margin-top:1px;
  min-height:16px;
}

.person-status.online{color:#25d366}

.header-actions{
  display:flex;
  align-items:center;
  gap:2px;
}

/* NOTICES */

.chat-notice{
  margin:7px 10px 0;
  padding:9px 12px;
  border-radius:10px;
  background:rgba(0,168,132,.13);
  color:#b8f5df;
  font-size:11px;
  display:none;
  flex-shrink:0;
}

.chat-notice.show{display:block}

.chat-notice a{
  color:#53d9b6;
  margin-inline-start:5px;
}

/* MESSAGE AREA */

.message-area{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:14px 10px 20px;
  display:flex;
  flex-direction:column;
  gap:7px;
  overscroll-behavior:contain;
  scroll-behavior:smooth;

  background-color:#0b141a;
  background-image:
    radial-gradient(circle at 15% 20%,rgba(0,168,132,.055),transparent 38%),
    radial-gradient(circle at 85% 75%,rgba(36,90,103,.08),transparent 40%);
  background-size:cover;
  background-position:center;
  scrollbar-width:thin;
  scrollbar-color:#52636e transparent;
}

.message-area::before{
  content:"";
  position:fixed;
  pointer-events:none;
}

.date-divider{
  align-self:center;
  font-size:10px;
  color:#d0dce2;
  background:#182229;
  border:1px solid rgba(255,255,255,.06);
  padding:5px 14px;
  border-radius:8px;
  margin:5px 0 8px;
}

/* MESSAGE BUBBLES */

.message{
  max-width:min(84%,560px);
  min-width:85px;
  align-self:flex-start;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  column-gap:8px;
  row-gap:3px;
  padding:7px 9px 5px;
  background:var(--other);
  border:1px solid rgba(255,255,255,.025);
  border-radius:9px 9px 9px 2px;
  box-shadow:0 1px 1px rgba(0,0,0,.15);
  overflow-wrap:anywhere;
  position:relative;
  animation:messageIn .18s ease-out;
}

.message.theirs{margin-inline-end:auto}

.message.mine{
  align-self:flex-end;
  background:var(--mine);
  border-color:rgba(255,255,255,.025);
  border-radius:9px 9px 2px 9px;
}

@keyframes messageIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

.message-body{
  grid-column:1 / -1;
  font-size:13px;
  line-height:1.8;
  white-space:pre-wrap;
  word-break:break-word;
  color:#e9edef;
}

.message-time{
  grid-column:2;
  grid-row:2;
  font-size:9px;
  color:rgba(231,243,246,.65);
  text-align:left;
  direction:ltr;
  white-space:nowrap;
  align-self:center;
}

.message-status{
  grid-column:1;
  grid-row:2;
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  min-width:19px;
  font-size:12px;
  font-weight:800;
  color:#b8c7cd;
  direction:ltr;
  letter-spacing:-4px;
  line-height:1;
  white-space:nowrap;
  align-self:center;
}

.message-status.is-sent{
  color:#b8c7cd;
  letter-spacing:0;
}

.message-status.is-delivered{
  color:#b8c7cd;
  letter-spacing:-4px;
}

.message-status.is-read{
  color:var(--blue);
  letter-spacing:-4px;
  text-shadow:0 0 8px rgba(83,189,235,.2);
}

.message-image{
  display:block;
  max-width:100%;
  max-height:330px;
  object-fit:cover;
  border-radius:8px;
}

.message-audio{
  width:min(260px,65vw);
  height:40px;
}

.message-sticker{
  width:125px;
  height:125px;
  object-fit:contain;
}

.message video{
  display:block;
  max-width:100%;
  max-height:300px;
  border-radius:9px;
}

.empty-chat{
  margin:auto;
  text-align:center;
  color:#a3b1ba;
  font-size:12px;
  padding:25px;
}

/* COMPOSER */

.composer{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding:7px 7px calc(7px + env(safe-area-inset-bottom));
  background:var(--header);
  border-top:1px solid var(--line);
  z-index:4;
}

.composer-tools{
  display:flex;
  gap:0;
  align-items:center;
}

.tool-button{
  width:35px;
  height:43px;
  flex-shrink:0;
  border-radius:50%;
  background:transparent;
  color:#aebac0;
  display:grid;
  place-items:center;
}

.tool-button:active{background:rgba(255,255,255,.1)}

.tool-button svg{width:21px;height:21px}

.composer-input-wrap{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  background:#2a3942;
  border:1px solid rgba(255,255,255,.025);
  border-radius:24px;
  padding:0 13px;
  min-height:43px;
}

#messageInput{
  width:100%;
  min-width:0;
  height:41px;
  border:0;
  outline:0;
  resize:none;
  color:#f3f7f9;
  background:transparent;
  font-size:13px;
  font-family:inherit;
  padding:9px 0;
}

#messageInput::placeholder{color:#aebac0}

.send-button,
.record-button{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#00a884;
  color:#06251e;
  transition:transform .2s,background .2s;
}

.send-button:active,
.record-button:active{transform:scale(.93)}

.send-button svg,
.record-button svg{width:21px;height:21px}

.record-button{
  background:#2a3942;
  color:#d1d9dc;
}

.record-button.recording{
  background:#b92e4d;
  color:white;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{box-shadow:0 0 0 8px rgba(255,60,90,.12)}
}

/* LOADING */

.loading-screen{
  position:absolute;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  background:#0b141a;
  color:#b8f0e4;
  font-size:13px;
}

/* PANELS */

.panel-overlay{
  position:absolute;
  inset:0;
  z-index:10;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(3px);
  display:flex;
  align-items:flex-end;
  animation:overlayIn .18s ease;
}

@keyframes overlayIn{
  from{opacity:0}
  to{opacity:1}
}

.bottom-panel{
  width:100%;
  max-height:78%;
  overflow:auto;
  background:#202c33;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px 18px 0 0;
  padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -15px 45px rgba(0,0,0,.38);
  animation:panelIn .22s ease;
}

@keyframes panelIn{
  from{transform:translateY(25px)}
  to{transform:translateY(0)}
}

.panel-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.panel-heading strong{font-size:14px}

.close-panel{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ffffff12;
  color:#e9f0f3;
  font-size:20px;
  display:grid;
  place-items:center;
}

.sticker-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.sticker-choice{
  min-height:68px;
  border-radius:12px;
  background:#ffffff09;
  border:1px solid var(--line);
  font-size:32px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.menu-item{
  min-height:78px;
  border-radius:12px;
  background:#ffffff08;
  border:1px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:10px;
  color:#dce6eb;
  padding:8px 4px;
  text-align:center;
}

.menu-item:active{background:#ffffff16}

.menu-item svg{
  color:#25d366;
  width:22px;
  height:22px;
}

.recording-strip{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 13px;
  background:#4c2032;
  color:#ffdce5;
  font-size:12px;
}

.record-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff5278;
  animation:pulse 1s infinite;
}

.reply-preview{
  padding:8px 12px;
  background:#1c2b33;
  border-right:3px solid #00a884;
  font-size:11px;
  color:#dce4e8;
  display:flex;
  justify-content:space-between;
}

.reply-preview button{
  background:transparent;
  color:white;
  font-size:19px;
}

/* RESPONSIVE */

@media(max-width:380px){
  .chat-header{gap:5px;padding-inline:6px}
  .back-button,.header-action{width:35px;height:37px}
  .person-avatar{width:39px;height:39px}
  .header-actions{gap:0}
  .composer{gap:2px;padding-inline:4px}
  .tool-button{width:31px}
  .send-button,.record-button{width:41px;height:41px}
  .message{max-width:88%}
}

@media(min-width:760px){
  body{padding:15px}
  .chat-shell{
    height:calc(100dvh - 30px);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
  }
}
</style>
</head>

<body>
<main class="chat-shell">

  <div id="loadingScreen" class="loading-screen">
    جارٍ فتح المحادثة...
  </div>

  <header class="chat-header">

    <button class="back-button" id="mobileBackBtn" type="button" aria-label="رجوع">
      <svg viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>

    <div class="person-avatar" id="chatAvatar">هـ</div>

    <div class="person-info">
      <div class="person-name" id="chatName">المحادثة</div>
      <div class="person-status" id="chatStatus">هنون</div>
    </div>

    <div class="header-actions">

      <button class="header-action" id="chatSearchBtn" type="button" aria-label="بحث داخل المحادثة">
        <svg viewBox="0 0 24 24">
          <circle cx="10.8" cy="10.8" r="6.8"/>
          <path d="m16 16 5 5"/>
        </svg>
      </button>

      <button class="header-action" id="chatMoreBtn" type="button" aria-label="إعدادات المحادثة">
        <svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1"/>
          <circle cx="12" cy="12" r="1"/>
          <circle cx="19" cy="12" r="1"/>
        </svg>
      </button>

    </div>
  </header>

  <div id="authNotice" class="chat-notice">
    سجل الدخول أولاً لفتح المحادثة.
    <a href="../index.html">تسجيل الدخول</a>
  </div>

  <div id="globalNotice" class="chat-notice"></div>

  <div id="recordingStrip" class="recording-strip hidden">
    <span class="record-dot"></span>
    <span id="recordingTime">00:00</span>
    <span>جارٍ تسجيل الرسالة الصوتية</span>
    <button id="cancelRecordingBtn" type="button"
      style="margin-right:auto;background:transparent;color:white">
      إلغاء
    </button>
  </div>

  <div id="replyPreview" class="reply-preview hidden">
    <span id="replyPreviewText">الرد على رسالة</span>
    <button id="cancelReplyBtn" type="button">×</button>
  </div>

  <section
    class="message-area"
    id="messageList"
    aria-live="polite"
    aria-label="الرسائل"
  >
    <div class="empty-chat">ابدأ محادثتك الآن</div>
  </section>

  <form class="composer" id="messageForm">

    <div class="composer-tools">

      <button class="tool-button" id="attachBtn" type="button" aria-label="إرفاق ملف">
        <svg viewBox="0 0 24 24">
          <path d="m21 11.5-9.5 9.5a6 6 0 0 1-13-8.5l10-10a4 4 0 0 1 5.7 5.7l-10 10a2 2 0 0 1-2.8-2.8l9-9"/>
        </svg>
      </button>

      <button class="tool-button" id="stickerBtn" type="button" aria-label="الملصقات">
        <svg viewBox="0 0 24 24">
          <path d="M20 13V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/>
          <path d="M14 21v-5a2 2 0 0 1 2-2h5"/>
          <path d="M8 9h8M8 13h4"/>
        </svg>
      </button>

    </div>

    <div class="composer-input-wrap">
      <input
        id="messageInput"
        type="text"
        autocomplete="off"
        maxlength="5000"
        placeholder="اكتب رسالة"
        aria-label="اكتب رسالتك"
      >
    </div>

    <button class="record-button" id="recordVoiceBtn" type="button" aria-label="تسجيل صوتي">
      <svg viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="13" rx="3"/>
        <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/>
      </svg>
    </button>

    <button class="send-button" id="sendMessageBtn" type="submit" aria-label="إرسال الرسالة">
      <svg viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
      </svg>
    </button>

  </form>

  <input id="chatImageInput" class="hidden" type="file" accept="image/*">
  <input id="chatFileInput" class="hidden" type="file"
    accept="image/*,video/*,.pdf,.doc,.docx,.txt,.xls,.xlsx">

  <!-- STICKERS -->

  <div id="stickerPanel" class="panel-overlay hidden">
    <div class="bottom-panel">
      <div class="panel-heading">
        <strong>الملصقات</strong>
        <button class="close-panel" type="button" data-close-panel="stickerPanel">×</button>
      </div>

      <div class="sticker-grid" id="stickerGrid">
        <button class="sticker-choice" type="button" data-sticker="❤️">❤️</button>
        <button class="sticker-choice" type="button" data-sticker="😍">😍</button>
        <button class="sticker-choice" type="button" data-sticker="🥰">🥰</button>
        <button class="sticker-choice" type="button" data-sticker="😂">😂</button>
        <button class="sticker-choice" type="button" data-sticker="👏">👏</button>
        <button class="sticker-choice" type="button" data-sticker="🔥">🔥</button>
        <button class="sticker-choice" type="button" data-sticker="🌹">🌹</button>
        <button class="sticker-choice" type="button" data-sticker="👍">👍</button>
      </div>
    </div>
  </div>

  <!-- ATTACHMENTS -->

  <div id="attachPanel" class="panel-overlay hidden">
    <div class="bottom-panel">
      <div class="panel-heading">
        <strong>إرسال مرفق</strong>
        <button class="close-panel" type="button" data-close-panel="attachPanel">×</button>
      </div>

      <div class="menu-grid">

        <button class="menu-item" id="chooseImageBtn" type="button">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          صورة
        </button>

        <button class="menu-item" id="chooseFileBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>
          ملف
        </button>

        <button class="menu-item" id="chooseCameraBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          الكاميرا
        </button>

      </div>
    </div>
  </div>

  <!-- CHAT SETTINGS -->

  <div id="chatActionsPanel" class="panel-overlay hidden">
    <div class="bottom-panel">

      <div class="panel-heading">
        <strong>إعدادات المحادثة</strong>
        <button class="close-panel" type="button" data-close-panel="chatActionsPanel">×</button>
      </div>

      <div class="menu-grid">

        <button class="menu-item" id="chatWallpaperBtn" type="button">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          خلفية المحادثة
        </button>

        <button class="menu-item" id="chatPrivacyBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          الخصوصية والظهور
        </button>

        <button class="menu-item" id="chatMediaBtn" type="button">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          الوسائط والملفات
        </button>

        <button class="menu-item" id="chatClearBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6"/>
            <path d="M10 11v5m4-5v5"/>
          </svg>
          مسح المحادثة
        </button>

        <button class="menu-item" id="chatBlockBtn" type="button">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="m5.6 5.6 12.8 12.8"/>
          </svg>
          حظر المستخدم
        </button>

      </div>
    </div>
  </div>

</main>

<script src="../js/chat-receipts.js"></script>
<script src="../js/chat-replies.js"></script>
<script type="module" src="../js/supabase-client.js"></script>
