
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <title>المراسلة | هنون</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c1220;
      --panel: #141e30;
      --panel2: #19263a;
      --line: rgba(255,255,255,.08);
      --text: #f3f5ff;
      --muted: #9aa8bd;
      --accent: #42cdbb;
      --purple: #9179f5;
      --mine: linear-gradient(135deg,#6553bd,#51429e);
      --other: #1c2b40;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Cairo,sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      background:
        radial-gradient(ellipse at 15% 5%,rgba(100,76,190,.19),transparent 42%),
        radial-gradient(ellipse at 90% 90%,rgba(30,180,170,.12),transparent 38%),
        var(--bg);
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    .chat-shell {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 900px;
      margin: auto;
      background: rgba(12,18,32,.78);
      border-inline: 1px solid var(--line);
      position: relative;
    }

    .chat-header {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 13px;
      background: rgba(20,30,48,.94);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      z-index: 5;
      backdrop-filter: blur(18px);
    }

    .back-button, .header-action {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      display: grid;
      place-items: center;
    }

    .back-button svg, .header-action svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .person-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg,#7866d9,#32b9ac);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-weight: 800;
      font-size: 18px;
    }

    .person-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .person-info {
      min-width: 0;
      flex: 1;
    }

    .person-name {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .person-status.online {
      color: #48d8a8;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .chat-notice {
      margin: 10px 13px 0;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(145,121,245,.12);
      color: #d9d0ff;
      font-size: 12px;
      display: none;
      flex-shrink: 0;
    }

    .chat-notice.show {
      display: block;
    }

    .message-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 17px 13px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overscroll-behavior: contain;
      background:
        radial-gradient(circle at 20% 30%,rgba(120,100,210,.07),transparent 32%),
        radial-gradient(circle at 80% 70%,rgba(40,180,165,.06),transparent 35%);
    }

    .date-divider {
      align-self: center;
      font-size: 10px;
      color: #c1c7d8;
      background: rgba(28,43,64,.85);
      padding: 5px 13px;
      border-radius: 20px;
      margin: 5px 0;
    }

    .message {
      max-width: min(82%,520px);
      align-self: flex-start;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 70px;
      padding: 9px 12px 7px;
      background: var(--other);
      border: 1px solid rgba(255,255,255,.045);
      border-radius: 16px 16px 16px 5px;
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
      overflow-wrap: anywhere;
    }

    .message.mine {
      align-self: flex-end;
      background: var(--mine);
      border-color: rgba(255,255,255,.08);
      border-radius: 16px 16px 5px 16px;
    }

    .message-body {
      font-size: 13px;
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-time {
      font-size: 9px;
      color: rgba(255,255,255,.66);
      text-align: left;
      direction: ltr;
    }

    .message-status {
      font-size: 9px;
      color: #bcefe7;
      text-align: left;
    }

    .message-image {
      max-width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 11px;
    }

    .empty-chat {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 25px;
    }

    .composer {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 11px 12px calc(11px + env(safe-area-inset-bottom));
      background: rgba(20,30,48,.97);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .composer-input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: #202d43;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 19px;
      padding: 0 13px;
      min-height: 45px;
    }

    #messageInput {
      width: 100%;
      min-width: 0;
      height: 43px;
      border: 0;
      outline: 0;
      resize: none;
      color: white;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      padding: 10px 0;
    }

    #messageInput::placeholder {
      color: #91a0b7;
    }

    .send-button {
      width: 47px;
      height: 47px;
      flex-shrink: 0;
      border-radius: 16px;
      background: linear-gradient(135deg,#4bcdbb,#279caa);
      display: grid;
      place-items: center;
      box-shadow: 0 5px 18px rgba(48,190,174,.2);
    }

    .send-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .send-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hidden {
      display: none !important;
    }

    .loading-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #0c1220;
      color: #bdb1ff;
      font-size: 13px;
    }

    @media (min-width: 760px) {
      body {
        padding: 15px;
      }

      .chat-shell {
        height: calc(100dvh - 30px);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 20px 70px rgba(0,0,0,.3);
      }
    }
  </style>
</head>

<body>
  <main class="chat-shell">
    <div id="loadingScreen" class="loading-screen">
      جارٍ فتح المحادثة...
    </div>

    <header class="chat-header">
      <button class="back-button" id="mobileBackBtn" type="button" aria-label="رجوع">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>

      <div class="person-avatar" id="chatAvatar">هـ</div>

      <div class="person-info">
        <div class="person-name" id="chatName">المحادثة</div>
        <div class="person-status" id="chatStatus">هنون</div>
      </div>

      <div class="header-actions">
        <button class="header-action" id="chatMoreBtn" type="button" aria-label="المزيد">
          <svg viewBox="0 0 24 24">
            <circle cx="5" cy="12" r="1"/>
            <circle cx="12" cy="12" r="1"/>
            <circle cx="19" cy="12" r="1"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="authNotice" class="chat-notice">
      سجل الدخول أولاً لفتح المحادثة.
      <a href="../index.html">تسجيل الدخول</a>
    </div>

    <div id="globalNotice" class="chat-notice"></div>

    <section
      class="message-area"
      id="messageList"
      aria-live="polite"
      aria-label="الرسائل"
    >
      <div class="empty-chat">ابدأ محادثتك الآن</div>
    </section>

    <form class="composer" id="messageForm">
      <div class="composer-input-wrap">
        <input
          id="messageInput"
          type="text"
          autocomplete="off"
          maxlength="5000"
          placeholder="اكتب رسالتك..."
          aria-label="اكتب رسالتك"
        >
      </div>

      <button
        class="send-button"
        id="sendMessageBtn"
        type="submit"
        aria-label="إرسال الرسالة"
      >
        <svg viewBox="0 0 24 24">
          <path d="m22 2-7 20-4-9-9-4Z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>
    </form>
  </main>

  <script type="module" src="../js/supabase-client.js"></script>
  <script type="module" src="../js/chat.js"></script>
  <script src="../js/chat-preferences.js"></script>
</body>
</html>
