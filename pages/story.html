
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="اقرأ القصص والحكايات في مكتبة هنون.">
  <title>قراءة القصة | هنون</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(19, 27, 47, .88);
      --panel-soft: rgba(255, 255, 255, .045);
      --gold: #d9b875;
      --gold-light: #f1d9a2;
      --text: #f5f3ed;
      --muted: #a5adbf;
      --border: rgba(217, 184, 117, .18);
      --purple: #9a8aff;
      --reader-size: 19px;
      --reader-line: 2.25;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Cairo", sans-serif;
      background:
        linear-gradient(180deg, rgba(8, 13, 27, .82), rgba(8, 13, 27, .96)),
        url("../assets/backgrounds/stories-bg.svg") center top / cover fixed,
        var(--bg);
      overflow-x: hidden;
    }

    button, a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(241, 217, 162, .35);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(217, 184, 117, .2), rgba(154, 138, 255, .14));
    }

    .brand-mark svg {
      width: 23px;
      height: 23px;
      stroke: var(--gold-light);
    }

    .brand-name {
      font-size: 17px;
      font-weight: 900;
    }

    .brand-caption {
      display: block;
      margin-top: -5px;
      color: var(--muted);
      font-size: 10px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      color: var(--gold-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      font-size: 12px;
      font-weight: 700;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .story-hero {
      position: relative;
      min-height: 300px;
      display: flex;
      align-items: end;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background:
        radial-gradient(ellipse at 80% 0%, rgba(154, 138, 255, .19), transparent 48%),
        linear-gradient(135deg, #202943, #111a30);
      isolation: isolate;
    }

    .story-hero-image {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(0deg, rgba(6, 10, 21, .97), rgba(6, 10, 21, .54) 58%, rgba(6, 10, 21, .12));
    }

    .hero-content {
      width: 100%;
      padding: clamp(20px, 5vw, 38px);
    }

    .category-label {
      display: inline-block;
      padding: 6px 11px;
      color: var(--gold-light);
      border: 1px solid rgba(241, 217, 162, .3);
      border-radius: 30px;
      background: rgba(8, 13, 27, .55);
      font-size: 11px;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    .hero-content h1 {
      margin: 13px 0 7px;
      font-size: clamp(26px, 5vw, 39px);
      font-weight: 900;
      line-height: 1.5;
    }

    .hero-description {
      max-width: 680px;
      margin: 0;
      color: #d0d5e0;
      font-size: 13px;
      line-height: 2;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 16px;
      color: #c0c7d5;
      font-size: 11px;
    }

    .hero-meta strong {
      color: var(--gold-light);
      font-weight: 800;
    }

    .progress-panel {
      padding: 15px 18px;
      margin-bottom: 17px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 17px;
      background: var(--panel);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .progress-top strong {
      color: var(--gold-light);
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255, 255, 255, .09);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--gold));
      transition: width .25s ease;
    }

    .reader-layout {
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      align-items: start;
      gap: 17px;
    }

    .chapters-panel {
      position: sticky;
      top: 14px;
      padding: 17px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 19px;
      background: var(--panel);
      backdrop-filter: blur(15px);
    }

    .chapters-panel h2 {
      margin: 0 0 13px;
      font-size: 15px;
      font-weight: 900;
    }

    .chapter-list {
      display: grid;
      gap: 7px;
      max-height: 430px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(217, 184, 117, .3) transparent;
    }

    .chapter-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      text-align: right;
      color: #b8c0d0;
      border: 1px solid transparent;
      border-radius: 11px;
      background: rgba(255, 255, 255, .035);
      cursor: pointer;
      transition: .2s ease;
    }

    .chapter-item:hover {
      color: var(--gold-light);
      background: rgba(217, 184, 117, .07);
    }

    .chapter-item.active {
      color: var(--gold-light);
      border-color: rgba(217, 184, 117, .3);
      background: rgba(217, 184, 117, .1);
    }

    .chapter-number {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgba(255, 255, 255, .07);
      font-size: 10px;
      font-weight: 900;
    }

    .chapter-item.active .chapter-number {
      color: #171522;
      background: var(--gold-light);
    }

    .chapter-name {
      overflow: hidden;
      font-size: 11px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-card {
      min-width: 0;
      padding: clamp(17px, 3vw, 29px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 21px;
      background: rgba(17, 25, 44, .87);
      box-shadow: 0 15px 40px rgba(0, 0, 0, .18);
      transition: background .25s, color .25s;
    }

    .reader-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 15px;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .chapter-counter {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tool-btn {
      min-width: 36px;
      height: 35px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 9px;
      color: #c7cede;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 10px;
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: .2s ease;
    }

    .tool-btn:hover,
    .tool-btn.active {
      color: var(--gold-light);
      border-color: rgba(217, 184, 117, .35);
      background: rgba(217, 184, 117, .09);
    }

    .tool-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chapter-heading {
      margin-bottom: 23px;
      text-align: center;
    }

    .chapter-heading span {
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
    }

    .chapter-heading h2 {
      margin: 7px 0 0;
      color: var(--gold-light);
      font-size: clamp(21px, 4vw, 27px);
      font-weight: 900;
      line-height: 1.6;
    }

    .story-text {
      color: #e2e4eb;
      font-size: var(--reader-size);
      line-height: var(--reader-line);
      font-weight: 500;
      text-align: justify;
      overflow-wrap: anywhere;
    }

    .story-text p {
      margin: 0 0 22px;
    }

    .story-text p:first-child::first-letter {
      color: var(--gold-light);
    }

    .chapter-navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 23px;
      margin-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, .08);
    }

    .nav-btn {
      min-height: 43px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      color: #171522;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      transition: .2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .nav-btn:disabled {
      color: #788195;
      border: 1px solid rgba(255, 255, 255, .07);
      background: rgba(255, 255, 255, .045);
      cursor: not-allowed;
      opacity: .7;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .reader-card.light-mode {
      color: #292a31;
      border-color: rgba(190, 164, 111, .4);
      background: #f5f0e5;
    }

    .reader-card.light-mode .reader-toolbar {
      border-color: rgba(40, 40, 40, .12);
    }

    .reader-card.light-mode .chapter-counter {
      color: #686b74;
    }

    .reader-card.light-mode .tool-btn {
      color: #45454c;
      border-color: rgba(40, 40, 40, .15);
      background: rgba(40, 40, 40, .04);
    }

    .reader-card.light-mode .tool-btn.active,
    .reader-card.light-mode .tool-btn:hover {
      color: #8c6b2f;
      border-color: rgba(140, 107, 47, .4);
      background: rgba(140, 107, 47, .09);
    }

    .reader-card.light-mode .chapter-heading h2 {
      color: #795b2b;
    }

    .reader-card.light-mode .chapter-heading span {
      color: #9a783c;
    }

    .reader-card.light-mode .story-text {
      color: #34343a;
    }

    .reader-card.light-mode .chapter-navigation {
      border-color: rgba(40, 40, 40, .12);
    }

    .reader-card.light-mode .nav-btn:disabled {
      color: #777;
      border-color: rgba(40, 40, 40, .1);
      background: rgba(40, 40, 40, .05);
    }

    .bottom-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .secondary-btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 15px;
      color: #d6dbea;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      transition: .2s ease;
    }

    .secondary-btn:hover,
    .secondary-btn.saved {
      color: var(--gold-light);
      border-color: rgba(217, 184, 117, .35);
      background: rgba(217, 184, 117, .08);
    }

    .secondary-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .not-found {
      display: none;
      padding: 55px 20px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: var(--panel);
    }

    .not-found.visible {
      display: block;
    }

    .not-found h1 {
      margin: 0 0 10px;
      color: var(--gold-light);
      font-size: 25px;
    }

    .not-found p {
      color: var(--muted);
      font-size: 13px;
    }

    .not-found a {
      display: inline-flex;
      margin-top: 12px;
      padding: 11px 18px;
      color: #171522;
      border-radius: 11px;
      background: var(--gold-light);
      font-size: 12px;
      font-weight: 900;
    }

    .toast {
      position: fixed;
      z-index: 20;
      right: 50%;
      bottom: 22px;
      max-width: calc(100% - 30px);
      padding: 12px 17px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(18, 25, 43, .97);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
      font-size: 12px;
      opacity: 0;
      transform: translate(50%, 15px);
      pointer-events: none;
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(50%, 0);
    }

    .footer {
      padding-top: 30px;
      color: #8993a7;
      text-align: center;
      font-size: 11px;
    }

    .footer strong {
      color: var(--gold-light);
    }

    @media (max-width: 760px) {
      .reader-layout {
        grid-template-columns: 1fr;
      }

      .chapters-panel {
        position: static;
      }

      .chapter-list {
        display: flex;
        max-height: none;
        overflow-x: auto;
        padding-bottom: 5px;
      }

      .chapter-item {
        width: auto;
        min-width: 150px;
        flex: 0 0 auto;
      }

      .story-hero {
        min-height: 270px;
      }
    }

    @media (max-width: 480px) {
      .page-shell {
        width: calc(100% - 20px);
        padding-top: 11px;
      }

      .story-hero {
        min-height: 245px;
        border-radius: 19px;
      }

      .hero-content {
        padding: 19px;
      }

      .hero-content h1 {
        font-size: 25px;
      }

      .hero-description {
        font-size: 11px;
      }

      .reader-card {
        padding: 15px 13px;
        border-radius: 17px;
      }

      .reader-toolbar {
        align-items: flex-start;
      }

      .toolbar-actions {
        gap: 5px;
      }

      .tool-btn {
        min-width: 33px;
        height: 33px;
        padding: 0 7px;
      }

      .story-text {
        font-size: var(--reader-size);
      }

      .nav-btn {
        padding: 9px 11px;
        font-size: 10px;
      }

      .secondary-btn {
        flex: 1 1 auto;
        padding: 9px 10px;
      }

      .back-link {
        padding: 8px 10px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">

    <header class="topbar">
      <a class="brand" href="../index.html">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4.5h9.5A4.5 4.5 0 0 1 19 9v10.5H9A4 4 0 0 1 5 15.5z"/>
            <path d="M5 15.5a4 4 0 0 1 4-4h10"/>
            <path d="M9 8h6"/>
          </svg>
        </span>
        <span>
          <span class="brand-name">هنون</span>
          <span class="brand-caption">مساحة للمعرفة والخيال</span>
        </span>
      </a>

      <a class="back-link" href="stories.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        مكتبة القصص
      </a>
    </header>

    <section id="storyContent" hidden>
      <section class="story-hero" id="storyHero">
        <img class="story-hero-image" id="storyCover" alt="" hidden>
        <div class="hero-content">
          <span class="category-label" id="storyCategory"></span>
          <h1 id="storyTitle"></h1>
          <p class="hero-description" id="storyDescription"></p>
          <div class="hero-meta">
            <span>الكاتب: <strong id="storyAuthor"></strong></span>
            <span>عدد الفصول: <strong id="storyChapterCount"></strong></span>
            <span>مدة القراءة: <strong id="storyReadTime"></strong></span>
          </div>
        </div>
      </section>

      <section class="progress-panel">
        <div class="progress-top">
          <span>تقدمك في القصة</span>
          <strong id="progressText">0%</strong>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <div class="reader-layout">
        <aside class="chapters-panel">
          <h2>فصول القصة</h2>
          <div class="chapter-list" id="chapterList"></div>
        </aside>

        <section class="reader-card" id="readerCard">
          <div class="reader-toolbar">
            <span class="chapter-counter" id="chapterCounter"></span>

            <div class="toolbar-actions">
              <button class="tool-btn" id="fontDecrease" type="button" aria-label="تصغير الخط">A−</button>
              <button class="tool-btn" id="fontIncrease" type="button" aria-label="تكبير الخط">A+</button>

              <button class="tool-btn" id="themeToggle" type="button" aria-label="تغيير وضع القراءة">
                <svg viewBox="0 0 24 24">
                  <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/>
                </svg>
              </button>

              <button class="tool-btn" id="shareButton" type="button" aria-label="مشاركة القصة">
                <svg viewBox="0 0 24 24">
                  <circle cx="18" cy="5" r="3"/>
                  <circle cx="6" cy="12" r="3"/>
                  <circle cx="18" cy="19" r="3"/>
                  <path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"/>
                </svg>
              </button>
            </div>
          </div>

          <header class="chapter-heading">
            <span id="chapterNumber"></span>
            <h2 id="chapterTitle"></h2>
          </header>

          <article class="story-text" id="storyText"></article>

          <nav class="chapter-navigation" aria-label="التنقل بين الفصول">
            <button class="nav-btn" id="previousChapter" type="button">
              <svg viewBox="0 0 24 24">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              الفصل السابق
            </button>

            <button class="nav-btn" id="nextChapter" type="button">
              الفصل التالي
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </nav>
        </section>
      </div>

      <div class="bottom-actions">
        <button class="secondary-btn" id="bookmarkButton" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4z"/>
          </svg>
          <span id="bookmarkText">حفظ القصة</span>
        </button>

        <button class="secondary-btn" id="restoreButton" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <path d="M3 3v5h5M12 7v5l3 2"/>
          </svg>
          استئناف القراءة
        </button>

        <a class="secondary-btn" href="stories.html">
          العودة إلى المكتبة
        </a>
      </div>
    </section>

    <section class="not-found" id="notFound">
      <h1>القصة غير موجودة</h1>
      <p>لم نتمكن من العثور على القصة المطلوبة. ربما تغير الرابط أو أن القصة غير متاحة.</p>
      <a href="stories.html">العودة إلى مكتبة القصص</a>
    </section>

    <footer class="footer">
      <strong>هنون</strong> — كل صفحة تحمل حكاية.
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../data/stories.js"></script>

  <script>
    (function () {
      "use strict";

      const api = window.HANOON_STORIES_API;
      const params = new URLSearchParams(window.location.search);
      const storyId = params.get("id");

      const $ = function (id) {
        return document.getElementById(id);
      };

      const elements = {
        content: $("storyContent"),
        notFound: $("notFound"),
        hero: $("storyHero"),
        cover: $("storyCover"),
        category: $("storyCategory"),
        title: $("storyTitle"),
        description: $("storyDescription"),
        author: $("storyAuthor"),
        chapterCount: $("storyChapterCount"),
        readTime: $("storyReadTime"),
        progressText: $("progressText"),
        progressFill: $("progressFill"),
        chapterList: $("chapterList"),
        readerCard: $("readerCard"),
        chapterCounter: $("chapterCounter"),
        chapterNumber: $("chapterNumber"),
        chapterTitle: $("chapterTitle"),
        storyText: $("storyText"),
        previous: $("previousChapter"),
        next: $("nextChapter"),
        fontDecrease: $("fontDecrease"),
        fontIncrease: $("fontIncrease"),
        themeToggle: $("themeToggle"),
        share: $("shareButton"),
        bookmark: $("bookmarkButton"),
        bookmarkText: $("bookmarkText"),
        restore: $("restoreButton"),
        toast: $("toast")
      };

      let story = null;
      let currentChapter = 0;
      let fontSize = 19;
      let toastTimer = null;

      const categoryNames = {
        human: "قصة إنسانية",
        fiction: "خيال ومغامرة",
        mystery: "غموض وتشويق",
        inspiring: "قصة ملهمة",
        short: "قصة قصيرة"
      };

      function escapeHTML(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char];
        });
      }

      function storageKey(type) {
        return "hanoon-story-" + type + "-" + story.id;
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("show");

        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          elements.toast.classList.remove("show");
        }, 2300);
      }

      function getSavedPosition() {
        try {
          const value = localStorage.getItem(storageKey("position"));
          if (!value) return null;

          const parsed = JSON.parse(value);

          if (
            !parsed ||
            !Number.isInteger(parsed.chapter) ||
            parsed.chapter < 0 ||
            parsed.chapter >= story.chapters.length
          ) {
            return null;
          }

          return parsed;
        } catch (error) {
          return null;
        }
      }

      function savePosition() {
        try {
          localStorage.setItem(storageKey("position"), JSON.stringify({
            chapter: currentChapter,
            updatedAt: Date.now()
          }));
        } catch (error) {
          showToast("تعذر حفظ مكان القراءة على هذا الجهاز.");
        }
      }

      function isBookmarked() {
        try {
          const list = JSON.parse(localStorage.getItem("hanoon-story-saved") || "[]");
          return Array.isArray(list) && list.includes(story.id);
        } catch (error) {
          return false;
        }
      }

      function updateBookmarkUI() {
        const saved = isBookmarked();
        elements.bookmark.classList.toggle("saved", saved);
        elements.bookmarkText.textContent = saved ? "إزالة من المحفوظات" : "حفظ القصة";
      }

      function toggleBookmark() {
        try {
          let list = JSON.parse(localStorage.getItem("hanoon-story-saved") || "[]");

          if (!Array.isArray(list)) {
            list = [];
          }

          if (list.includes(story.id)) {
            list = list.filter(function (id) {
              return id !== story.id;
            });
            showToast("تمت إزالة القصة من المحفوظات.");
          } else {
            list.push(story.id);
            showToast("تم حفظ القصة على جهازك.");
          }

          localStorage.setItem("hanoon-story-saved", JSON.stringify(list));
          updateBookmarkUI();
        } catch (error) {
          showToast("تعذر حفظ القصة. تحقق من إعدادات المتصفح.");
        }
      }

      function renderStoryHeader() {
        elements.title.textContent = story.title;
        elements.description.textContent = story.description || "";
        elements.category.textContent =
          story.categoryLabel ||
          categoryNames[story.category] ||
          "قصة مميزة";

        elements.author.textContent = story.author || "هنون";
        elements.chapterCount.textContent = story.chapters.length;
        elements.readTime.textContent = story.readTime || "قراءة ممتعة";

        if (story.cover) {
          try {
            const imageURL = new URL(story.cover, window.location.href);

            if (imageURL.protocol === "https:" || imageURL.protocol === "http:") {
              elements.cover.src = imageURL.href;
              elements.cover.alt = story.title;
              elements.cover.hidden = false;
            }
          } catch (error) {
            elements.cover.hidden = true;
          }
        }
      }

      function renderChapterList() {
        elements.chapterList.innerHTML = story.chapters.map(function (chapter, index) {
          return `
            <button
              type="button"
              class="chapter-item ${index === currentChapter ? "active" : ""}"
              data-chapter="${index}"
              aria-current="${index === currentChapter ? "step" : "false"}"
            >
              <span class="chapter-number">${index + 1}</span>
              <span class="chapter-name">${escapeHTML(chapter.title)}</span>
            </button>
          `;
        }).join("");
      }

      function renderProgress() {
        const percentage = Math.round(
          ((currentChapter + 1) / story.chapters.length) * 100
        );

        elements.progressText.textContent = percentage + "%";
        elements.progressFill.style.width = percentage + "%";
      }

      function renderChapter() {
        const chapter = story.chapters[currentChapter];

        if (!chapter) return;

        elements.chapterCounter.textContent =
          "الفصل " + (currentChapter + 1) + " من " + story.chapters.length;

        elements.chapterNumber.textContent =
          "الفصل " + String(currentChapter + 1).padStart(2, "0");

        elements.chapterTitle.textContent = chapter.title;

        const paragraphs = Array.isArray(chapter.paragraphs)
          ? chapter.paragraphs
          : [];

        elements.storyText.innerHTML = paragraphs.map(function (paragraph) {
          return "<p>" + escapeHTML(paragraph) + "</p>";
        }).join("");

        elements.previous.disabled = currentChapter === 0;
        elements.next.disabled = currentChapter === story.chapters.length - 1;

        renderChapterList();
        renderProgress();
        savePosition();
      }

      function goToChapter(index) {
        if (!Number.isInteger(index)) return;
        if (index < 0 || index >= story.chapters.length) return;

        currentChapter = index;
        renderChapter();

        window.scrollTo({
          top: Math.max(0, elements.readerCard.getBoundingClientRect().top + window.scrollY - 15),
          behavior: "smooth"
        });
      }

      function changeFont(amount) {
        fontSize = Math.min(30, Math.max(14, fontSize + amount));
        document.documentElement.style.setProperty("--reader-size", fontSize + "px");

        try {
          localStorage.setItem("hanoon-story-font-size", String(fontSize));
        } catch (error) {
          // تغيير الخط يظل فعالًا خلال الجلسة حتى لو تعذر التخزين.
        }
      }

      function loadFontSize() {
        try {
          const saved = Number(localStorage.getItem("hanoon-story-font-size"));

          if (Number.isFinite(saved) && saved >= 14 && saved <= 30) {
            fontSize = saved;
          }
        } catch (error) {
          fontSize = 19;
        }

        document.documentElement.style.setProperty("--reader-size", fontSize + "px");
      }

      function toggleTheme() {
        const light = elements.readerCard.classList.toggle("light-mode");
        elements.themeToggle.classList.toggle("active", light);

        try {
          localStorage.setItem("hanoon-story-reading-theme", light ? "light" : "dark");
        } catch (error) {
          // لا يؤثر ذلك على عمل زر الوضع.
        }
      }

      function loadTheme() {
        try {
          const saved = localStorage.getItem("hanoon-story-reading-theme");

          if (saved === "light") {
            elements.readerCard.classList.add("light-mode");
            elements.themeToggle.classList.add("active");
          }
        } catch (error) {
          // الوضع الافتراضي هو الداكن.
        }
      }

      async function shareStory() {
        const shareData = {
          title: story.title + " | هنون",
          text: story.description || "اقرأ هذه القصة على هنون.",
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
          } catch (error) {
            if (error.name !== "AbortError") {
              copyStoryLink();
            }
          }
          return;
        }

        copyStoryLink();
      }

      async function copyStoryLink() {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(window.location.href);
            showToast("تم نسخ رابط القصة.");
            return;
          }

          const field = document.createElement("textarea");
          field.value = window.location.href;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();

          const copied = document.execCommand("copy");
          field.remove();

          showToast(copied ? "تم نسخ رابط القصة." : "تعذر نسخ الرابط تلقائيًا.");
        } catch (error) {
          showToast("تعذر نسخ الرابط.");
        }
      }

      function restorePosition() {
        const saved = getSavedPosition();

        if (!saved) {
          showToast("لا يوجد موضع قراءة محفوظ لهذه القصة بعد.");
          return;
        }

        currentChapter = saved.chapter;
        renderChapter();

        window.scrollTo({
          top: Math.max(0, elements.readerCard.getBoundingClientRect().top + window.scrollY - 15),
          behavior: "smooth"
        });

        showToast("تمت العودة إلى موضع قراءتك السابق.");
      }

      function bindEvents() {
        elements.previous.addEventListener("click", function () {
          goToChapter(currentChapter - 1);
        });

        elements.next.addEventListener("click", function () {
          goToChapter(currentChapter + 1);
        });

        elements.chapterList.addEventListener("click", function (event) {
          const button = event.target.closest("[data-chapter]");
          if (!button) return;

          goToChapter(Number(button.dataset.chapter));
        });

        elements.fontDecrease.addEventListener("click", function () {
          changeFont(-1);
        });

        elements.fontIncrease.addEventListener("click", function () {
          changeFont(1);
        });

        elements.themeToggle.addEventListener("click", toggleTheme);
        elements.share.addEventListener("click", shareStory);
        elements.bookmark.addEventListener("click", toggleBookmark);
        elements.restore.addEventListener("click", restorePosition);
      }

      function showNotFound() {
        elements.content.hidden = true;
        elements.notFound.classList.add("visible");
        document.title = "القصة غير موجودة | هنون";
      }

      function init() {
        if (
          !api ||
          typeof api.getById !== "function" ||
          !storyId
        ) {
          showNotFound();
          return;
        }

        story = api.getById(storyId);

        if (
          !story ||
          !Array.isArray(story.chapters) ||
          story.chapters.length === 0
        ) {
          showNotFound();
          return;
        }

        elements.content.hidden = false;
        elements.notFound.classList.remove("visible");

        document.title = story.title + " | هنون";

        renderStoryHeader();
        loadFontSize();
        loadTheme();

        const savedPosition = getSavedPosition();
        currentChapter = savedPosition ? savedPosition.chapter : 0;

        renderChapter();
        updateBookmarkUI();
        bindEvents();
      }

      init();
    })();
  </script>
</body>
</html>
