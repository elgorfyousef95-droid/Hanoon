
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a20">
<title>المراسلات | هنون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#51d9ce;
  --accent2:#8cf2e7;
  --text:#effbfc;
  --muted:#9eb9c0;
  --line:#76dcd52b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Cairo,sans-serif;
  background:
    radial-gradient(ellipse at 12% 10%,#14545c55,transparent 38%),
    radial-gradient(ellipse at 90% 80%,#17445b55,transparent 40%),
    linear-gradient(145deg,#06141c,#0a222a 55%,#07131c);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

.topbar{
  height:53px;
  padding:7px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
  background:#06171de8;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900}
.brand-icon{
  width:29px;height:29px;
  display:grid;place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,#25a99e,#267f91);
}
.brand-icon svg{width:18px;fill:none;stroke:white;stroke-width:1.8}
.back{
  padding:6px 12px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#ffffff09;
  color:#bdf9ef;
  font-size:10px;
  font-weight:800;
}
.page{width:min(1100px,96%);margin:16px auto 30px}

.heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.heading h1{margin:0;font-size:21px;font-weight:900}
.heading p{margin:3px 0 0;color:var(--muted);font-size:10px}

.btn{
  min-height:35px;
  padding:6px 12px;
  border:1px solid #63ded277;
  border-radius:11px;
  background:linear-gradient(135deg,#168e87,#236d83);
  color:white;
  font-size:10px;
  font-weight:900;
}
.btn.secondary{background:#ffffff09;border-color:var(--line);color:#bdf8ef}
.btn:disabled{opacity:.5;cursor:not-allowed}

.auth-notice,.notice{
  margin:12px 0;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#08232a;
  color:#d1f7f2;
  font-size:11px;
  line-height:1.9;
}
.notice.error{color:#ffc4ca;border-color:#ff849055}
.notice.success{color:#a9f5d8;border-color:#64d9b455}

.chat-layout{
  display:grid;
  grid-template-columns:320px minmax(0,1fr);
  height:min(720px,calc(100dvh - 130px));
  min-height:480px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:19px;
  background:#071a20d9;
  box-shadow:0 18px 50px #0005;
  backdrop-filter:blur(20px);
}

.sidebar{
  min-width:0;
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
  background:#0a2027d9;
}
.sidebar-head{padding:14px;border-bottom:1px solid var(--line)}
.sidebar-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sidebar-title h2{margin:0;font-size:14px;font-weight:900}
.search{
  width:100%;
  min-height:39px;
  padding:8px 12px;
  outline:none;
  border:1px solid var(--line);
  border-radius:11px;
  background:#03151b;
  color:white;
  font-size:10px;
}
.search:focus{border-color:var(--accent)}

.conversation-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:8px;
}
.conversation{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 8px;
  margin-bottom:5px;
  border:1px solid transparent;
  border-radius:12px;
  cursor:pointer;
}
.conversation:hover,.conversation.active{
  background:#47cfc018;
  border-color:#5bd9cf33;
}
.avatar{
  flex:0 0 42px;
  width:42px;height:42px;
  display:grid;place-items:center;
  overflow:hidden;
  border:1px solid #71dcd75c;
  border-radius:50%;
  background:linear-gradient(135deg,#167f7e,#285c7b);
  color:white;
  font-size:15px;
  font-weight:900;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.conversation-info{flex:1;min-width:0}
.conversation-name{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10px;font-weight:900
}
.conversation-last{
  margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);font-size:9px
}
.conversation-time{color:#91b4b6;font-size:8px}

.chat-main{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 30%,#1c50521b,transparent 55%),
    #07191f;
}
.chat-header{
  min-height:65px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
  background:#0a2028a8;
}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-size:12px;font-weight:900}
.chat-header-status{margin-top:3px;color:var(--muted);font-size:9px}
.mobile-back{display:none}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.chat-empty{
  flex:1;
  display:grid;
  place-items:center;
  padding:25px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:2.2;
}
.message{
  max-width:min(78%,430px);
  padding:9px 12px;
  border:1px solid #76dcd52b;
  border-radius:15px 15px 4px 15px;
  background:linear-gradient(135deg,#103d42,#12404a);
  box-shadow:0 5px 15px #0002;
  overflow-wrap:anywhere;
}
.message.mine{
  align-self:flex-start;
  border-color:#59d6c54c;
  border-radius:15px 15px 15px 4px;
  background:linear-gradient(135deg,#146e68,#18596b);
}
.message.theirs{align-self:flex-end}
.message-body{font-size:11px;line-height:1.9;white-space:pre-wrap}
.message-time{text-align:left;margin-top:4px;color:#a5cfca;font-size:8px}

.composer{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:11px;
  border-top:1px solid var(--line);
  background:#0a2028e8;
}
.composer textarea{
  flex:1;
  min-width:0;
  min-height:40px;
  max-height:110px;
  resize:none;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:#03151b;
  color:white;
  font-size:11px;
  line-height:1.7;
}
.composer textarea:focus{border-color:var(--accent)}
.send-btn{
  width:42px;height:40px;
  flex:0 0 42px;
  display:grid;place-items:center;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#25b9a8,#237c94);
  color:white;
}
.send-btn svg{width:19px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:700px){
  .page{width:100%;margin:0}
  .heading{padding:13px 13px 0}
  .chat-layout{
    height:calc(100dvh - 120px);
    min-height:420px;
    border-radius:0;
    border-left:0;border-right:0;
  }
  .sidebar{grid-column:1;grid-row:1;border-left:0}
  .chat-main{grid-column:1;grid-row:1}
  .chat-layout.show-chat .sidebar{display:none}
  .chat-layout:not(.show-chat) .chat-main{display:none}
  .mobile-back{display:block}
  .messages{padding:12px}
  .message{max-width:85%}
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
      </svg>
    </span>
    HANOON
  </a>
  <a class="back" href="friends.html">الأصدقاء</a>
</header>

<main class="page">

  <section class="heading">
    <div>
      <h1>المراسلات</h1>
      <p>مساحة خاصة للتواصل مع أصدقائك</p>
    </div>
    <button class="btn secondary" id="refreshChatsBtn" type="button">تحديث</button>
  </section>

  <div id="authNotice" class="auth-notice hidden">
    سجّل الدخول أولاً لاستخدام المراسلات.
    <a href="auth.html" style="color:#8cf2e7;font-weight:900">تسجيل الدخول</a>
  </div>

  <div id="globalNotice" class="notice hidden" role="status"></div>

  <section id="messagesApp" class="chat-layout hidden">

    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <h2>المحادثات</h2>
          <span id="chatCount" style="font-size:9px;color:#9eb9c0">0</span>
        </div>
        <input
          id="conversationSearch"
          class="search"
          type="search"
          placeholder="ابحث في المحادثات..."
          autocomplete="off"
        >
      </div>

      <div id="conversationList" class="conversation-list">
        <div class="chat-empty">جارٍ تحميل المحادثات...</div>
      </div>
    </aside>

    <section class="chat-main">

      <header class="chat-header">
        <button class="btn secondary mobile-back" id="mobileBackBtn" type="button">رجوع</button>

        <div id="chatAvatar" class="avatar">هـ</div>

        <div class="chat-header-info">
          <div id="chatName" class="chat-header-name">اختر محادثة</div>
          <div id="chatStatus" class="chat-header-status">محادثاتك الخاصة</div>
        </div>
      </header>

      <div id="messageList" class="messages">
        <div class="chat-empty">
          اختر صديقاً من قائمة المحادثات لبدء التواصل.
        </div>
      </div>

      <form id="messageForm" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="5000"
          placeholder="اكتب رسالتك..."
          aria-label="نص الرسالة"
          disabled
        ></textarea>

        <button class="send-btn" id="sendMessageBtn" type="submit" disabled aria-label="إرسال الرسالة">
          <svg viewBox="0 0 24 24">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </form>

    </section>

  </section>

</main>

<script type="module" src="../js/supabase-client.js"></script>
<script type="module" src="../js/messages.js"></script>
<script src="../js/chat-preferences.js"></script>

</body>
</html>
