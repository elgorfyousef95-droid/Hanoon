
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#102b32">
<title>المراسلات | هنون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --green:#20b9a6;
  --green-light:#72e4d5;
  --bg:#0b171c;
  --panel:#12252c;
  --panel2:#1a3038;
  --text:#f2f7f8;
  --muted:#9aafb5;
  --line:#ffffff13;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  min-height:0;
  margin:0;
  overflow:hidden!important;
  overscroll-behavior:none;
}
body{
  font-family:Cairo,sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}

.topbar{
  height:52px;
  flex:0 0 52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#102b32;
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:15px;
  font-weight:900;
}
.brand-icon{
  width:29px;
  height:29px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,#20b9a6,#267d91);
}
.brand-icon svg{
  width:18px;
  fill:none;
  stroke:white;
  stroke-width:1.8;
}
.back-link{
  padding:6px 12px;
  border:1px solid #ffffff20;
  border-radius:20px;
  background:#ffffff09;
  color:#b7f6eb;
  font-size:10px;
  font-weight:800;
}

.page{
  width:100%;
  height:calc(100dvh - 52px);
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.heading{
  height:65px;
  flex:0 0 65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#10232a;
  border-bottom:1px solid var(--line);
}
.heading h1{
  margin:0;
  font-size:17px;
  font-weight:900;
}
.heading p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:9px;
}
.btn{
  min-height:34px;
  padding:5px 12px;
  border:1px solid #ffffff20;
  border-radius:10px;
  background:#ffffff0a;
  color:#c9f8f0;
  font-size:10px;
  font-weight:800;
}
.btn:disabled{opacity:.5}

.auth-notice,.notice{
  flex:0 0 auto;
  margin:8px 12px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#142c33;
  color:#d7f8f2;
  font-size:11px;
  line-height:1.8;
}
.notice.error{color:#ffc1c8;border-color:#ff718055}
.notice.success{color:#a8f5d7;border-color:#55d5a755}

.chat-layout{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:340px minmax(0,1fr);
  overflow:hidden;
  background:var(--bg);
}
.sidebar{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#10232a;
  border-left:1px solid var(--line);
}
.sidebar-head{
  flex:0 0 auto;
  padding:12px;
  border-bottom:1px solid var(--line);
}
.sidebar-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.sidebar-title h2{
  margin:0;
  font-size:14px;
  font-weight:900;
}
.search{
  width:100%;
  height:39px;
  padding:0 13px;
  outline:none;
  border:1px solid #ffffff16;
  border-radius:22px;
  background:#07171c;
  color:white;
  font-size:11px;
}
.search:focus{border-color:var(--green)}
.conversation-list{
  flex:1;
  min-height:0;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:5px 8px;
}
.conversation{
  width:100%;
  min-height:69px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 7px;
  margin:0;
  border:0;
  border-bottom:1px solid #ffffff0d;
  border-radius:0;
  background:transparent;
  cursor:pointer;
}
.conversation:hover,.conversation.active{
  background:#ffffff0b;
}
.avatar{
  width:47px;
  height:47px;
  flex:0 0 47px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px solid #53d5c74c;
  border-radius:50%;
  background:linear-gradient(135deg,#147d79,#285b78);
  color:white;
  font-size:16px;
  font-weight:900;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.conversation-info{
  flex:1;
  min-width:0;
}
.conversation-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#f4f8f9;
  font-size:11px;
  font-weight:900;
}
.conversation-last{
  margin-top:4px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#9db2b8;
  font-size:9px;
}
.conversation-time{
  align-self:flex-start;
  padding-top:4px;
  color:#8eaaa9;
  font-size:8px;
}

.chat-main{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#0c191e;
}
.chat-header{
  height:61px;
  min-height:61px;
  flex:0 0 61px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 12px;
  background:#142a31;
  border-bottom:1px solid var(--line);
}
.chat-header .avatar{
  width:42px;
  height:42px;
  flex-basis:42px;
}
.chat-header-info{
  flex:1;
  min-width:0;
}
.chat-header-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:900;
}
.chat-header-status{
  margin-top:2px;
  color:#9db6b9;
  font-size:9px;
}
.mobile-back{
  display:none;
  flex:0 0 auto;
}

.messages{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:13px 12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background-color:#101d22;
  background-image:
    radial-gradient(#ffffff08 1px,transparent 1px);
  background-size:19px 19px;
}
.chat-empty{
  flex:1;
  display:grid;
  place-items:center;
  padding:25px;
  text-align:center;
  color:#9cb4b9;
  font-size:11px;
  line-height:2;
}
.message{
  width:fit-content;
  max-width:min(78%,460px);
  min-width:65px;
  padding:7px 10px 5px;
  border:1px solid #ffffff0b;
  border-radius:13px 13px 4px 13px;
  background:#20343b;
  color:#f3f8f9;
  overflow-wrap:anywhere;
  box-shadow:0 2px 4px #0002;
}
.message.mine{
  align-self:flex-start;
  border-radius:13px 13px 13px 4px;
  background:#075e54;
}
.message.theirs{align-self:flex-end}
.message-body{
  font-size:11px;
  line-height:1.8;
  white-space:pre-wrap;
}
.message-time{
  margin-top:3px;
  text-align:left;
  color:#b0d1ca;
  font-size:8px;
}

.composer{
  flex:0 0 auto;
  min-height:61px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:#142a31;
  border-top:1px solid var(--line);
}
.composer textarea{
  flex:1;
  min-width:0;
  min-height:41px;
  max-height:105px;
  resize:none;
  padding:9px 13px;
  border:1px solid #ffffff16;
  border-radius:22px;
  outline:none;
  background:#08191e;
  color:white;
  font-size:11px;
  line-height:1.7;
}
.composer textarea:focus{border-color:#32c7b6}
.send-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#20b9a6,#167b8a);
  color:white;
}
.send-btn svg{
  width:19px;
  fill:none;
  stroke:white;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.send-btn:disabled{opacity:.45}

@media(max-width:700px){
  .topbar{height:48px;flex-basis:48px}
  .page{
    height:calc(100dvh - 48px);
    height:calc(100dvh - 48px - env(safe-area-inset-top));
  }
  .heading{display:none}
  .chat-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    height:100%;
    min-height:0;
    border:0;
  }
  .sidebar{
    grid-column:1;
    grid-row:1;
    border:0;
  }
  .chat-main{
    grid-column:1;
    grid-row:1;
    display:none;
  }
  .chat-layout.show-chat .sidebar{display:none}
  .chat-layout.show-chat .chat-main{display:flex}
  .mobile-back{
    display:grid;
    place-items:center;
    width:34px;
    height:34px;
    min-height:34px;
    padding:0;
  }
  .messages{padding:12px 9px}
  .message{max-width:86%}
  .sidebar-head{padding:13px}
  .conversation{min-height:73px}
}
@media(min-width:701px){
  .mobile-back{display:none!important}
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
      </svg>
    </span>
    HANOON
  </a>
  <a class="back-link" href="friends.html">الأصدقاء</a>
</header>

<main class="page">

  <section class="heading">
    <div>
      <h1>المراسلات</h1>
      <p>رسائلك ومحادثاتك الخاصة</p>
    </div>
    <button class="btn" id="refreshChatsBtn" type="button">تحديث</button>
  </section>

  <div id="authNotice" class="auth-notice hidden">
    سجّل الدخول أولاً لاستخدام المراسلات.
    <a href="auth.html" style="color:#8cf2e7;font-weight:900">تسجيل الدخول</a>
  </div>

  <div id="globalNotice" class="notice hidden" role="status"></div>

  <section id="messagesApp" class="chat-layout hidden">

    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <h2>المحادثات</h2>
          <span id="chatCount" style="font-size:9px;color:#9eb9c0">0</span>
        </div>
        <input
          id="conversationSearch"
          class="search"
          type="search"
          placeholder="ابحث في المحادثات..."
          autocomplete="off"
        >
      </div>

      <div id="conversationList" class="conversation-list">
        <div class="chat-empty">جارٍ تحميل المحادثات...</div>
      </div>
    </aside>

    <section class="chat-main">

      <header class="chat-header">
        <button class="btn mobile-back" id="mobileBackBtn" type="button" aria-label="العودة للمحادثات">
          <svg viewBox="0 0 24 24" width="17" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>

        <div id="chatAvatar" class="avatar">هـ</div>

        <div class="chat-header-info">
          <div id="chatName" class="chat-header-name">اختر محادثة</div>
          <div id="chatStatus" class="chat-header-status">محادثاتك الخاصة</div>
        </div>
      </header>

      <div id="messageList" class="messages">
        <div class="chat-empty">
          اختر محادثة من القائمة لبدء التواصل.
        </div>
      </div>

      <form id="messageForm" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="5000"
          placeholder="اكتب رسالة..."
          aria-label="نص الرسالة"
          disabled
        ></textarea>

        <button class="send-btn" id="sendMessageBtn" type="submit" disabled aria-label="إرسال الرسالة">
          <svg viewBox="0 0 24 24">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </form>

    </section>
  </section>
</main>

<script type="module" src="../js/supabase-client.js"></script>
<script type="module" src="../js/messages.js"></script>
<script src="../js/chat-preferences.js"></script>

</body>
</html>
