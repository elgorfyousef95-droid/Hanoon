
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b20">
  <title>المنشورات | هنون</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #100b20;
      --panel: rgba(29, 21, 49, .88);
      --panel-light: rgba(43, 31, 70, .78);
      --purple: #a78bfa;
      --purple-strong: #8b5cf6;
      --pink: #e879f9;
      --text: #f7f2ff;
      --muted: #b6a9cb;
      --border: rgba(201, 171, 255, .15);
      --success: #5ce0b1;
      --danger: #ff7898;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Cairo, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 10%, rgba(139,92,246,.22), transparent 36%),
        radial-gradient(ellipse at 88% 30%, rgba(232,121,249,.13), transparent 32%),
        radial-gradient(ellipse at 50% 100%, rgba(91,55,160,.22), transparent 42%),
        linear-gradient(145deg, #100b20, #17102c 52%, #0d1023);
      background-attachment: fixed;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page-shell {
      width: min(100% - 28px, 980px);
      margin: auto;
      padding: 22px 0 55px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 19px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(115deg, rgba(139,92,246,.19), rgba(29,21,49,.88));
      box-shadow: 0 15px 45px rgba(0,0,0,.2);
      margin-bottom: 18px;
    }

    .heading-title {
      font-size: 21px;
      font-weight: 900;
      margin: 0;
    }

    .heading-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .heading-icon {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(145deg, var(--purple-strong), #bd72f5);
      box-shadow: 0 8px 25px rgba(139,92,246,.3);
    }

    .heading-icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: white;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .composer {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 15px 45px rgba(0,0,0,.17);
      margin-bottom: 18px;
      backdrop-filter: blur(18px);
    }

    .composer-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      color: white;
      font-weight: 800;
      background: linear-gradient(140deg, #8058e9, #dc79e9);
      border: 2px solid rgba(255,255,255,.18);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .composer-label {
      font-weight: 800;
      font-size: 14px;
    }

    .composer-hint {
      font-size: 11px;
      color: var(--muted);
    }

    .post-text {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      padding: 14px;
      color: var(--text);
      background: rgba(12,9,25,.65);
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: none;
      font-size: 14px;
    }

    .post-text:focus {
      border-color: rgba(167,139,250,.7);
      box-shadow: 0 0 0 3px rgba(139,92,246,.1);
    }

    .post-text::placeholder {
      color: #9184a8;
    }

    .media-preview {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 15px;
      background: rgba(12,9,25,.55);
      border: 1px solid var(--border);
    }

    .media-preview.visible {
      display: block;
    }

    .media-preview img,
    .media-preview video {
      max-width: 100%;
      max-height: 250px;
      display: block;
      margin: auto;
      border-radius: 10px;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 13px;
      flex-wrap: wrap;
    }

    .media-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .media-button,
    .publish-button,
    .refresh-button {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
      background: var(--panel-light);
    }

    .media-button svg,
    .publish-button svg,
    .refresh-button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .media-button:hover,
    .refresh-button:hover {
      border-color: var(--purple);
      background: rgba(139,92,246,.16);
    }

    .publish-button {
      min-width: 112px;
      border: 0;
      color: white;
      background: linear-gradient(120deg, #8055e9, #b76be9);
      box-shadow: 0 7px 22px rgba(139,92,246,.25);
    }

    .publish-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .feed-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 2px 13px;
    }

    .feed-title {
      font-size: 17px;
      font-weight: 900;
    }

    .feed-title small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .post-list {
      display: grid;
      gap: 15px;
    }

    .post-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: var(--panel);
      box-shadow: 0 12px 38px rgba(0,0,0,.17);
      backdrop-filter: blur(15px);
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 15px 16px 10px;
    }

    .post-author {
      min-width: 0;
      flex: 1;
    }

    .author-name {
      font-size: 13px;
      font-weight: 900;
    }

    .post-date {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .post-content {
      padding: 4px 17px 14px;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .post-media {
      width: 100%;
      max-height: 470px;
      display: block;
      object-fit: contain;
      background: #090713;
    }

    .post-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 16px;
      color: var(--muted);
      font-size: 11px;
      border-bottom: 1px solid var(--border);
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      padding: 10px 12px;
    }

    .post-action {
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #c6bad8;
      padding: 9px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
    }

    .post-action:hover {
      background: rgba(167,139,250,.1);
      color: white;
    }

    .post-action.liked {
      color: var(--pink);
    }

    .post-action svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .comments-panel {
      display: none;
      padding: 13px 15px 16px;
      border-top: 1px solid var(--border);
    }

    .comments-panel.open {
      display: block;
    }

    .comments-list {
      display: grid;
      gap: 9px;
      margin-bottom: 12px;
    }

    .comment-item {
      padding: 9px 11px;
      border-radius: 12px;
      background: rgba(10,8,22,.5);
      font-size: 12px;
    }

    .comment-author {
      color: var(--purple);
      font-weight: 900;
      margin-bottom: 3px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
    }

    .comment-input {
      min-width: 0;
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      color: white;
      background: rgba(10,8,22,.7);
      font-size: 12px;
    }

    .comment-submit {
      border: 0;
      border-radius: 11px;
      padding: 0 14px;
      color: white;
      font-size: 12px;
      font-weight: 800;
      background: var(--purple-strong);
    }

    .notice {
      display: none;
      padding: 12px 14px;
      border-radius: 13px;
      margin-bottom: 14px;
      background: rgba(139,92,246,.16);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .notice.visible {
      display: block;
    }

    .notice.error {
      color: #ff9caf;
      border-color: rgba(255,120,152,.3);
    }

    .notice.success {
      color: var(--success);
      border-color: rgba(92,224,177,.3);
    }

    .auth-notice {
      padding: 35px 20px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    .empty-state {
      text-align: center;
      padding: 35px 15px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 17px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .page-shell {
        width: min(100% - 18px, 980px);
        padding-top: 12px;
      }

      .page-heading {
        padding: 12px 14px;
        border-radius: 17px;
      }

      .heading-title {
        font-size: 18px;
      }

      .composer {
        padding: 13px;
        border-radius: 17px;
      }

      .post-text {
        min-height: 95px;
      }

      .media-button,
      .publish-button {
        padding: 8px 10px;
        font-size: 11px;
      }

      .post-card {
        border-radius: 17px;
      }

      .post-actions {
        gap: 2px;
        padding: 8px;
      }

      .post-action {
        font-size: 11px;
        gap: 5px;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">

    <header class="page-heading">
      <div>
        <h1 class="heading-title">المنشورات</h1>
        <div class="heading-subtitle">شارك أفكارك ولحظاتك مع أصدقائك في هنون</div>
      </div>

      <div class="heading-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
        </svg>
      </div>
    </header>

    <div id="globalNotice" class="notice"></div>

    <div id="authNotice" class="auth-notice hidden">
      يجب تسجيل الدخول إلى هنون حتى تتمكن من مشاهدة المنشورات والتفاعل معها.
    </div>

    <section id="postsApp" class="hidden">

      <section class="composer">
        <div class="composer-top">
          <div id="composerAvatar" class="avatar">هـ</div>
          <div>
            <div id="composerName" class="composer-label">عضو هنون</div>
            <div class="composer-hint">منشور جديد للجميع</div>
          </div>
        </div>

        <form id="postForm">
          <textarea
            id="postText"
            class="post-text"
            maxlength="10000"
            placeholder="ماذا تريد أن تشارك اليوم؟"
          ></textarea>

          <div id="mediaPreview" class="media-preview"></div>

          <div class="composer-actions">
            <div class="media-buttons">

              <label class="media-button" for="postImage">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="3"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <path d="m21 15-5-5L5 21"/>
                </svg>
                صورة
              </label>

              <input
                id="postImage"
                type="file"
                accept="image/*"
                hidden
              >

              <label class="media-button" for="postVideo">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="5" width="13" height="14" rx="2"/>
                  <path d="m16 10 5-3v10l-5-3z"/>
                </svg>
                فيديو
              </label>

              <input
                id="postVideo"
                type="file"
                accept="video/*"
                hidden
              >
            </div>

            <button id="publishPostBtn" class="publish-button" type="submit">
              <svg viewBox="0 0 24 24">
                <path d="m22 2-7 20-4-9-9-4Z"/>
                <path d="M22 2 11 13"/>
              </svg>
              نشر المنشور
            </button>
          </div>
        </form>
      </section>

      <div class="feed-toolbar">
        <div class="feed-title">
          أحدث المنشورات
          <small>منشورات أعضاء هنون</small>
        </div>

        <button id="refreshPostsBtn" class="refresh-button" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M20 7v5h-5"/>
            <path d="M4 17v-5h5"/>
            <path d="M5.6 9a7 7 0 0 1 11.6-2L20 12"/>
            <path d="M18.4 15a7 7 0 0 1-11.6 2L4 12"/>
          </svg>
          تحديث
        </button>
      </div>

      <div id="postsList" class="post-list">
        <div class="empty-state">جارٍ تحميل المنشورات...</div>
      </div>

    </section>
  </main>

  <script type="module" src="../js/supabase-client.js"></script>
  <script type="module" src="../js/posts.js"></script>
</body>
</html>
