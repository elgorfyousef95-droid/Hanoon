
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111426">
  <title>الأرشيف | هنون</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101426;
      --panel: #191e35;
      --panel2: #222943;
      --line: rgba(255,255,255,.08);
      --text: #f5f3ff;
      --muted: #a6aac2;
      --purple: #a18cff;
      --teal: #42cdbb;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Cairo, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      background:
        radial-gradient(ellipse at 15% 0%,rgba(140,108,240,.22),transparent 42%),
        radial-gradient(ellipse at 90% 90%,rgba(52,180,178,.12),transparent 40%),
        #101426;
    }

    button, input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      border: 0;
    }

    .archive-shell {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 850px;
      margin: auto;
      border-inline: 1px solid var(--line);
      background: rgba(16,20,38,.76);
    }

    .archive-header {
      padding: 18px 17px 15px;
      background: rgba(25,30,53,.92);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      backdrop-filter: blur(18px);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-button {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .back-button svg,
    .archive-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .archive-icon {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: linear-gradient(135deg,#9278ed,#5e65c8);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 22px rgba(126,104,220,.22);
    }

    .heading {
      min-width: 0;
      flex: 1;
    }

    .heading h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 800;
    }

    .heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .archive-count {
      min-width: 29px;
      height: 29px;
      border-radius: 10px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      background: rgba(161,140,255,.14);
      color: #c7baff;
      font-size: 12px;
      font-weight: 800;
    }

    .search-wrap {
      margin-top: 17px;
      height: 45px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.055);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
    }

    .search-wrap svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.8;
    }

    #archiveSearch {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font-size: 12px;
      font-family: inherit;
    }

    #archiveSearch::placeholder {
      color: #969bb4;
    }

    .archive-hint {
      margin: 13px 16px 0;
      padding: 10px 12px;
      border-radius: 12px;
      color: #d1c9ff;
      background: rgba(142,116,240,.11);
      font-size: 11px;
      line-height: 1.8;
      flex-shrink: 0;
    }

    .archive-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overscroll-behavior: contain;
    }

    .archive-card {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 12px;
      border-radius: 17px;
      background: linear-gradient(135deg,rgba(37,43,73,.95),rgba(27,34,58,.94));
      border: 1px solid var(--line);
      box-shadow: 0 7px 20px rgba(0,0,0,.12);
    }

    .archive-avatar {
      width: 49px;
      height: 49px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#9078e9,#36b7a8);
      font-weight: 800;
      font-size: 17px;
    }

    .archive-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .archive-info {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .archive-name {
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .archive-preview {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .archive-time {
      font-size: 9px;
      color: #a6aac2;
      white-space: nowrap;
      margin-top: 4px;
    }

    .restore-button {
      flex-shrink: 0;
      padding: 8px 10px;
      border-radius: 11px;
      background: rgba(61,201,174,.13);
      color: #77e3cb;
      font-size: 10px;
      font-weight: 700;
    }

    .archive-empty {
      margin: auto;
      text-align: center;
      padding: 35px 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 2;
    }

    .archive-empty svg {
      width: 57px;
      height: 57px;
      display: block;
      margin: 0 auto 14px;
      fill: none;
      stroke: #a18cff;
      stroke-width: 1.3;
    }

    .notice {
      margin: 10px 14px 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,80,105,.13);
      color: #ffb9c5;
      font-size: 11px;
      display: none;
      flex-shrink: 0;
    }

    .notice.show {
      display: block;
    }

    .loading {
      margin: auto;
      text-align: center;
      color: #c7baff;
      font-size: 12px;
    }

    @media (min-width: 760px) {
      body {
        padding: 15px;
      }

      .archive-shell {
        height: calc(100dvh - 30px);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 20px 70px rgba(0,0,0,.3);
      }
    }
  </style>
</head>

<body>
  <main class="archive-shell">

    <header class="archive-header">
      <div class="header-top">

        <button
          class="back-button"
          id="archiveBackBtn"
          type="button"
          aria-label="رجوع"
        >
          <svg viewBox="0 0 24 24">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>

        <div class="archive-icon">
          <svg viewBox="0 0 24 24">
            <path d="M3 4h18v4H3z"/>
            <path d="M5 8v12h14V8"/>
            <path d="M9 12h6"/>
          </svg>
        </div>

        <div class="heading">
          <h1>المحادثات المؤرشفة</h1>
          <p>احتفظ بمحادثاتك بعيدًا عن صندوق الوارد</p>
        </div>

        <span class="archive-count" id="archiveCount">0</span>
      </div>

      <label class="search-wrap">
        <svg viewBox="0 0 24 24">
          <circle cx="10.8" cy="10.8" r="7.3"/>
          <path d="m16.2 16.2 5 5"/>
        </svg>

        <input
          id="archiveSearch"
          type="search"
          placeholder="ابحث في الأرشيف..."
          autocomplete="off"
        >
      </label>
    </header>

    <div class="archive-hint">
      المحادثات هنا لا تظهر في صندوق الوارد. يمكنك إرجاع أي محادثة بضغطة واحدة.
    </div>

    <div id="archiveNotice" class="notice"></div>

    <section class="archive-list" id="archiveList">
      <div class="loading">جارٍ تحميل الأرشيف...</div>
    </section>

  </main>

  <script type="module" src="../js/supabase-client.js"></script>
  <script type="module" src="../js/archived.js"></script>
</body>
</html>
