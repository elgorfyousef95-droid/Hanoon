  <circle cx="1230" cy="300" r="220"
          stroke="#D5B36C" stroke-opacity=".09"/>
  <circle cx="1230" cy="300" r="270"
          stroke="#D5B36C" stroke-opacity=".055"/>
  <circle cx="1230" cy="300" r="320"
          stroke="#D5B36C" stroke-opacity=".035"/>

  <path d="M0 720 Q420 590 800 730 T1600 650"
