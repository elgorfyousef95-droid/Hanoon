
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#A98237" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#A98237" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#52658D" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#52658D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" stroke="#D5B36C" stroke-opacity=".055" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#D5B36C" fill-opacity=".12"/>
