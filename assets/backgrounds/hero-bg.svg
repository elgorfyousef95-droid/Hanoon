  </defs>

  <rect width="1600" height="900" fill="#10131C"/>
  <ellipse cx="1220" cy="260" rx="600" ry="500" fill="url(#glow1)"/>
  <ellipse cx="260" cy="750" rx="550" ry="430" fill="url(#glow2)"/>
