
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="articleBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101522"/>
      <stop offset=".55" stop-color="#202337"/>
      <stop offset="1" stop-color="#0A101A"/>
    </linearGradient>
    <radialGradient id="articleGlow">
      <stop offset="0" stop-color="#C9A45C" stop-opacity=".23"/>
      <stop offset="1" stop-color="#C9A45C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="articleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A98237" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#E8CD91" stop-opacity=".65"/>
      <stop offset="1" stop-color="#A98237" stop-opacity=".1"/>
    </linearGradient>
    <pattern id="articlePattern" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 45H90M45 0V90" stroke="#D5B36C" stroke-opacity=".035"/>
      <circle cx="45" cy="45" r="20" fill="none" stroke="#D5B36C" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1400" height="800" fill="url(#articleBase)"/>
  <ellipse cx="1050" cy="350" rx="520" ry="420" fill="url(#articleGlow)"/>
  <rect width="1400" height="800" fill="url(#articlePattern)"/>
  <!-- Decorative writing lines -->
  <g transform="translate(850 170)" fill="none" stroke="url(#articleGold)" stroke-width="2">
    <rect x="0" y="0" width="350" height="430" rx="12" opacity=".5"/>
    <path d="M45 65H300M45 105H275M45 145H310M45 185H250"/>
    <path d="M45 245H300M45 285H270M45 325H310M45 365H220"/>
    <path d="M45 65V365" opacity=".15"/>
  </g>
  <!-- Pen -->
  <g transform="translate(650 230) rotate(-35)" fill="none" stroke="#D5B36C" stroke-width="3" stroke-linejoin="round">
    <path d="M0 0L35 -25L220 160L185 195Z" fill="#A98237" fill-opacity=".12"/>
    <path d="M0 0L35 -25L70 10L35 45Z"/>
    <path d="M185 195L220 160L205 220Z"/>
    <path d="M35 -25L185 195"/>
    <path d="M55 -5L205 175" opacity=".5"/>
  </g>
  <!-- Decorative idea circles -->
  <g fill="none" stroke="#D5B36C" stroke-opacity=".23">
    <circle cx="350" cy="390" r="190"/>
    <circle cx="350" cy="390" r="225" stroke-dasharray="4 12"/>
    <circle cx="350" cy="390" r="260" opacity=".5"/>
  </g>
  <!-- Abstract quotation marks -->
  <g fill="#E8CD91" opacity=".25">
    <path d="M220 285H280L260 345H225Z"/>
    <path d="M300 285H360L340 345H305Z"/>
  </g>
  <!-- Decorative light particles -->
  <g fill="#E8CD91">
    <circle cx="150" cy="180" r="2" opacity=".7"/>
    <circle cx="500" cy="160" r="3" opacity=".5"/>
    <circle cx="750" cy="640" r="2" opacity=".6"/>
    <circle cx="1240" cy="120" r="2.5" opacity=".6"/>
    <circle cx="1150" cy="690" r="2" opacity=".5"/>
    <circle cx="600" cy="500" r="2" opacity=".4"/>
  </g>
  <path d="M0 1H1400" stroke="#D5B36C" stroke-opacity=".25"/>
  <rect x="1" y="1" width="1398" height="798" fill="none" stroke="#D5B36C" stroke-opacity=".08"/>
</svg>
