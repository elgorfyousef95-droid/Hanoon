
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151B29"/>
      <stop offset="55%" stop-color="#10131C"/>
      <stop offset="100%" stop-color="#1B202B"/>
    </linearGradient>

    <radialGradient id="goldGlow">
      <stop offset="0%" stop-color="#D5B36C" stop-opacity=".19"/>
      <stop offset="100%" stop-color="#D5B36C" stop-opacity="0"/>
    </radialGradient>

    <pattern id="ornament" width="100" height="100"
             patternUnits="userSpaceOnUse">
      <path d="M50 0 L100 50 L50 100 L0 50 Z"
            stroke="#D5B36C" stroke-opacity=".09"/>
      <circle cx="50" cy="50" r="13"
              stroke="#D5B36C" stroke-opacity=".08"/>
      <circle cx="50" cy="50" r="3"
              fill="#D5B36C" fill-opacity=".13"/>
    </pattern>
  </defs>

  <rect width="1600" height="700" fill="url(#base)"/>

  <ellipse cx="1250" cy="180" rx="480" ry="380"
           fill="url(#goldGlow)"/>

  <ellipse cx="150" cy="600" rx="400" ry="280"
           fill="url(#goldGlow)"/>

  <rect width="1600" height="700" fill="url(#ornament)"/>

  <path d="M0 560 Q400 460 800 550 T1600 470"
        stroke="#D5B36C" stroke-opacity=".12"
        stroke-width="1.5"/>

  <path d="M0 580 Q400 480 800 570 T1600 490"
        stroke="#D5B36C" stroke-opacity=".06"/>

  <circle cx="1330" cy="180" r="110"
          stroke="#E8CD91" stroke-opacity=".12"/>

  <circle cx="1330" cy="180" r="140"
          stroke="#E8CD91" stroke-opacity=".06"/>
</svg>
